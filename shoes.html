<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <meta property="og:site_name" content="Mileage">
  <meta property="og:title" content="Mileage — Shoes">
  <meta property="og:description" content="Shoe roster — lifetime miles and wear vs. goal for each pair.">
  <meta property="og:url" content="https://twoseam.github.io/mileage/shoes.html">
  <meta property="og:image" content="https://twoseam.github.io/mileage/apple-touch-icon-1024.png">

  <meta name="twitter:title" content="Mileage — Shoes">
  <meta name="twitter:description" content="Shoe roster — lifetime miles and wear vs. goal for each pair.">
  <meta name="twitter:image" content="https://twoseam.github.io/mileage/apple-touch-icon-1024.png">

  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://p.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/ymz2nvi.css">

  <script src="miles-tracker.js"></script>
  <script src="nav.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scrollbar-width: none; -ms-overflow-style: none; }
    body::-webkit-scrollbar { display: none; }
    body {
      background: #252525;
      color: #f5f5f5;
      font-family: "omnes", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .mt-bg {
      position: fixed;
      top: calc(-74px - env(safe-area-inset-bottom, 0px));
      left: 0; right: 0; bottom: 0;
      z-index: -1;
      pointer-events: none;
      /* extend the div above the viewport so the wedge sits above the bottom
         nav bar while staying flush with the viewport bottom (no dark gap) */
      background: linear-gradient(
        159deg,
        transparent 0%, transparent 76.6%,
        #016074 76.6%, #016074 78.8%,
        #94D3BE 78.8%, #94D3BE 81.1%,
        #E7D7A4 81.1%, #E7D7A4 83.9%,
        #EB9A00 83.9%, #EB9A00 86.6%,
        #CA6902 86.6%, #CA6902 89.3%,
        #B02113 89.3%, #B02113 100%
      );
    }

    .wordmark {
      max-width: 720px;
      margin: 1.25rem auto 0.5rem;
      padding: 0 2rem;
      text-align: center;
      font-family: "omnes", system-ui, sans-serif;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 0.01em;
    }
    .wordmark-year  { font-size: clamp(2.5rem, 10vw, 4rem); color: #8FCFC2; margin-bottom: 0.1em; }
    .wordmark-title { font-size: clamp(2.5rem, 10vw, 4rem); color: #E89A1F; }
    .page-title {
      font-size: 0.65rem; letter-spacing: 0.24em; text-transform: uppercase;
      opacity: 0.5; margin-top: 0.6rem; font-weight: 700;
    }

    #shoes-shell { max-width: 720px; margin: 0 auto; padding: 1.25rem 1.1rem 3rem; }

    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin: 1.75rem 0 0.85rem;
    }
    .section-head h2 {
      margin: 0; font-size: 0.7rem; font-weight: 800;
      letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55;
    }

    /* Shoe card */
    .shoe-card {
      display: flex; gap: 1.6rem; align-items: stretch;
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 0.9rem;
      margin-bottom: 0.85rem;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.2,0.8,0.2,1);
    }
    .shoe-card.retired { opacity: 0.55; }
    /* entrance: cards start hidden, JS lifts .reveal to fade them in (staggered) */
    .shoe-card.reveal { opacity: 0 !important; transform: translateY(12px); }

    #retired-wrap {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.4s cubic-bezier(0.2,0.8,0.2,1), opacity 0.3s ease;
    }
    #retired-wrap.open { max-height: 1600px; opacity: 1; }
    .shoe-photo {
      flex: 0 0 36%; width: 36%;
      aspect-ratio: 1 / 1;
      border-radius: 12px; overflow: hidden;
      background: #1c1c1c;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .shoe-num {
      position: absolute; right: 6px; bottom: 6px;
      min-width: 24px; height: 24px; padding: 0 5px;
      border-radius: 999px;
      background: #E89A1F; color: #1a1a1a;
      font-size: 0.78rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.45);
    }
    .shoe-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .shoe-photo .ph {
      font-size: 2.6rem; opacity: 0.25;
    }
    .shoe-body {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      justify-content: center;          /* vertically centered in the card */
    }
    /* 1 — primary: brand + model */
    .shoe-name {
      font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em;
      line-height: 1.1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* 2 — secondary: colorway */
    .shoe-color {
      font-size: 0.8rem; font-weight: 700;
      color: #E89A1F; opacity: 0.9;
      margin-top: 1px;
    }
    /* 3 — tertiary: walk count */
    .shoe-walks {
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      opacity: 0.5; font-weight: 700; margin-top: 0.6rem;
    }
    /* 4 — the key stat */
    .shoe-miles {
      font-size: 1.05rem; font-weight: 800; margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .shoe-miles span { font-size: 0.6rem; opacity: 0.5; font-weight: 700; }
    /* 6 — bottom-aligned: purchase date */
    .shoe-when {
      margin-top: 0.7rem;
      font-size: 0.56rem; letter-spacing: 0.1em; text-transform: uppercase;
      opacity: 0.35; font-weight: 700;
    }
    .shoe-dur { margin-top: 2px; opacity: 0.8; }
    .wear-track {
      margin-top: 6px; height: 6px; border-radius: 3px;
      background: rgba(255,255,255,0.08); overflow: hidden;
    }
    .wear-fill {
      height: 100%; border-radius: 3px; background: #8FCFC2;
      transition: width 0.5s cubic-bezier(0.2,0.8,0.2,1);
    }
    .wear-fill.warn { background: #EB9A00; }
    .wear-fill.over { background: #B02113; }

    .empty-note {
      opacity: 0.4; font-size: 0.8rem; text-align: center;
      padding: 1.5rem 0;
    }

    /* Buttons */
    .btn-row { display: flex; gap: 10px; margin-top: 1.5rem; }
    .btn {
      flex: 1; padding: 13px 14px; border: none; border-radius: 10px;
      font-family: inherit; font-size: 0.72rem; font-weight: 800;
      letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
      transition: filter 0.15s ease, opacity 0.15s ease;
    }
    .btn:active { filter: brightness(0.92); }
    /* primary buttons get the Track It 3D ledge + push */
    .btn-add, .sheet-actions .btn-save {
      box-shadow: 0 5px 0 #8E5A0E, 0 10px 18px rgba(0, 0, 0, 0.4);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .btn-add:active, .sheet-actions .btn-save:active {
      transform: translateY(5px); filter: none;
      box-shadow: 0 0 0 #8E5A0E, 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    .btn-add {
      background: #E89A1F; color: #1a1a1a;
    }
    .btn-ghost {
      background: transparent; color: #f5f5f5;
      border: 1px solid rgba(255,255,255,0.18);
    }

    /* Add-pair sheet */
    #add-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
      z-index: 10002;
    }
    #add-backdrop.show { opacity: 1; pointer-events: auto; }
    #add-sheet, #act-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10003;
      background: #f5f0e6; color: #1a1a1a;
      border-radius: 18px 18px 0 0;
      padding: 1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2,0.8,0.2,1);
      max-width: 520px; margin: 0 auto;
    }
    #add-sheet.show, #act-sheet.show { transform: translateY(0); }
    #add-sheet h3, #act-sheet h3 {
      margin: 0 0 1.1rem; font-size: 1.4rem; font-weight: 900;
    }
    .fld { margin-bottom: 1rem; }
    .fld-row { display: flex; gap: 12px; }
    .fld-row .fld { flex: 1; }
    .act-row {
      display: block; width: 100%; text-align: left;
      padding: 15px 4px; background: none; border: none;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      font-family: inherit; font-size: 1.05rem; font-weight: 700;
      color: #1a1a1a; cursor: pointer;
    }
    .act-row:last-of-type { border-bottom: none; }
    .act-row.act-cancel { opacity: 0.5; font-weight: 600; }
    .fld label {
      display: block; font-size: 0.6rem; font-weight: 800;
      letter-spacing: 0.14em; text-transform: uppercase;
      opacity: 0.55; margin-bottom: 6px;
    }
    .fld input[type=text], .fld input[type=date], .fld input[type=number] {
      width: 100%; padding: 12px; border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.18); background: #fff;
      font-family: inherit; font-size: 1rem; color: #1a1a1a;
      -webkit-appearance: none; appearance: none;
    }
    .photo-pick {
      width: 100%; aspect-ratio: 1 / 1; border-radius: 12px;
      border: 2px dashed rgba(0,0,0,0.22); background: #fff;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; cursor: pointer; position: relative;
    }
    .photo-pick img { width: 100%; height: 100%; object-fit: cover; }
    .photo-pick .hint {
      font-size: 0.75rem; font-weight: 700; opacity: 0.45;
      text-align: center; padding: 1rem; letter-spacing: 0.04em;
    }
    .photo-pick input { display: none; }
    .sheet-actions { display: flex; gap: 10px; margin-top: 1.3rem; }
    .sheet-actions .btn-save {
      flex: 1; background: #E89A1F; color: #1a1a1a;
    }
    .sheet-actions .btn-cancel {
      flex: 0 0 auto; background: transparent; color: #1a1a1a;
      border: none; opacity: 0.55; box-shadow: none;
    }
    .btn[disabled] { opacity: 0.5; pointer-events: none; }

    /* Loader */
    #mt-loader {
      position: fixed; inset: 0; background: #252525;
      display: flex; align-items: center; justify-content: center;
      z-index: 10000; transition: opacity 0.5s ease;
    }
    #mt-loader.mt-loader-hide { opacity: 0; pointer-events: none; }
    .mt-loader-bar {
      width: 240px; height: 12px; border-radius: 6px;
      background: rgba(255,255,255,0.08); overflow: hidden;
    }
    .mt-loader-fill {
      height: 100%; width: 0%;
      background: linear-gradient(to right,
        #016074 0%, #016074 16.67%, #94D3BE 16.67%, #94D3BE 33.33%,
        #E7D7A4 33.33%, #E7D7A4 50%, #EB9A00 50%, #EB9A00 66.67%,
        #CA6902 66.67%, #CA6902 83.33%, #B02113 83.33%, #B02113 100%);
      background-size: 240px 100%;
      transition: width 0.3s ease-out;
    }

    .mt-pill {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
      background: #f5f0e6; color: #1a1a1a; font-weight: 800; font-size: 0.8rem;
      padding: 10px 18px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 10004;
    }
    .mt-pill.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .mt-footer { text-align: center; padding: 0 1.5rem 2rem; }
    .mt-build {
      font-size: 0.55rem; letter-spacing: 0.15em; opacity: 0.18;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    .mt-footer .mt-ver {
      display: inline-block;
      font-size: 0.6rem; letter-spacing: 0.15em; opacity: 0.3;
      color: inherit; text-decoration: none;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      transition: opacity 0.2s ease;
    }
    .mt-footer .mt-ver:hover { opacity: 0.7; }

    /* ---------- LIGHT MODE (additive; dark rules above untouched) ---------- */
    html[data-theme="light"] .wordmark-year  { color: #0E7A8C; }
    html[data-theme="light"] .wordmark-title { color: #C77A0C; }
    html[data-theme="light"] .shoe-card {
      background: #fffdf7; border-color: rgba(0, 0, 0, 0.08);
    }
    html[data-theme="light"] .shoe-photo { background: #ece4d2; }
    html[data-theme="light"] .shoe-color { color: #C77A0C; }
    html[data-theme="light"] .wear-track { background: rgba(0, 0, 0, 0.10); }
    html[data-theme="light"] .btn-ghost {
      color: #252525; border-color: rgba(0, 0, 0, 0.20);
    }
    html[data-theme="light"] #mt-loader { background: #f1ebdd; }
    html[data-theme="light"] .mt-loader-bar { background: rgba(0, 0, 0, 0.10); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

<div class="mt-bg"></div>

<div id="mt-loader">
  <div class="mt-loader-bar"><div class="mt-loader-fill"></div></div>
</div>

<div class="wordmark">
  <div class="wordmark-title">MILEAGE</div>
  <div class="page-title">Shoes</div>
</div>

<div id="shoes-shell">

  <div class="section-head"><h2>Current</h2></div>
  <div id="current-list"></div>

  <div id="retired-wrap">
    <div class="section-head"><h2>Retired</h2></div>
    <div id="retired-list"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-ghost" id="toggle-retired">Show retired</button>
    <button class="btn btn-add" id="open-add">+ Add a pair</button>
  </div>

</div>

<div id="add-backdrop"></div>
<div id="add-sheet">
  <h3>Add a pair</h3>
  <div class="fld-row">
    <div class="fld">
      <label for="sh-brand">Brand</label>
      <input type="text" id="sh-brand" placeholder="Hoka" autocomplete="off">
    </div>
    <div class="fld">
      <label for="sh-model">Model</label>
      <input type="text" id="sh-model" placeholder="Clifton 9" autocomplete="off">
    </div>
  </div>
  <div class="fld-row">
    <div class="fld">
      <label for="sh-color">Color</label>
      <input type="text" id="sh-color" placeholder="Black" autocomplete="off">
    </div>
    <div class="fld">
      <label for="sh-goal">Mileage goal</label>
      <input type="number" id="sh-goal" placeholder="400" inputmode="numeric" min="1">
    </div>
  </div>
  <div class="fld">
    <label for="sh-date">Purchase date</label>
    <input type="date" id="sh-date">
  </div>
  <div class="fld">
    <label>Photo</label>
    <label class="photo-pick" id="photo-pick">
      <span class="hint" id="photo-hint">Tap to add a photo<br>(cropped to a square)</span>
      <img id="photo-preview" style="display:none" alt="">
      <input type="file" id="sh-photo" accept="image/*">
    </label>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-cancel" id="add-cancel">Cancel</button>
    <button class="btn btn-save" id="add-save" disabled>Save pair</button>
  </div>
</div>

<div id="act-sheet">
  <h3 id="act-title">Shoe</h3>
  <button class="act-row" id="act-photo">Change photo</button>
  <button class="act-row" id="act-retire">Retire today</button>
  <button class="act-row act-cancel" id="act-cancel">Cancel</button>
  <input type="file" id="act-photo-input" accept="image/*" style="display:none">
</div>

<div class="mt-pill" id="pill"></div>

<footer class="mt-footer">
  <a class="mt-ver" href="changelog.html"></a>
</footer>

<script>
(function() {
  'use strict';

  var WEAR_TARGET = 400; // miles before a pair is "due to retire"
  var photoDataUrl = null;

  // ---------- loader ----------
  var loaderTimer = null, loaderValue = 0;
  function startLoader() {
    var fill = document.querySelector('.mt-loader-fill');
    if (!fill) return;
    loaderValue = 0; fill.style.width = '0%';
    loaderTimer = setInterval(function() {
      if (loaderValue >= 95) return;
      loaderValue += Math.max(0.4, (95 - loaderValue) * 0.04);
      fill.style.width = loaderValue + '%';
    }, 100);
  }
  function stopLoader() {
    if (loaderTimer) { clearInterval(loaderTimer); loaderTimer = null; }
    var fill = document.querySelector('.mt-loader-fill');
    if (fill) fill.style.width = '100%';
    setTimeout(function() {
      var l = document.getElementById('mt-loader');
      if (l) l.classList.add('mt-loader-hide');
    }, 350);
  }

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
    });
  }
  function fmtDate(s) {
    if (!s) return '';
    var d = new Date(s + 'T12:00:00');
    if (isNaN(d)) return s;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function mdy(s) {
    if (!s) return '';
    var d = new Date(s + 'T12:00:00');
    if (isNaN(d)) return s;
    return ('0' + (d.getMonth() + 1)).slice(-2) + '/' + ('0' + d.getDate()).slice(-2) + '/' + d.getFullYear();
  }
  function durUsed(a, b) {
    var d1 = new Date(a + 'T12:00:00'), d2 = new Date(b + 'T12:00:00');
    if (isNaN(d1) || isNaN(d2)) return '';
    var days = Math.round((d2 - d1) / 86400000);
    if (days < 31) return days + ' day' + (days === 1 ? '' : 's');
    var months = (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth());
    if (d2.getDate() < d1.getDate()) months--;
    if (months < 12) return months + ' month' + (months === 1 ? '' : 's');
    var yrs = Math.floor(months / 12), rem = months % 12;
    return yrs + ' yr' + (yrs === 1 ? '' : 's') + (rem ? ' ' + rem + ' mo' : '');
  }
  function pill(msg, sticky) {
    var p = document.getElementById('pill');
    p.textContent = msg;
    p.classList.add('show');
    if (!sticky) setTimeout(function() { p.classList.remove('show'); }, 2500);
  }

  // ---------- render ----------
  var allShoes = [];

  function cropToSquare(file, cb) {
    var img = new Image();
    img.onload = function() {
      var side = Math.min(img.width, img.height);
      var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      var size = 640;
      var c = document.createElement('canvas');
      c.width = size; c.height = size;
      c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
      var url = c.toDataURL('image/jpeg', 0.85);
      URL.revokeObjectURL(img.src);
      cb(url);
    };
    img.onerror = function() { cb(null); };
    img.src = URL.createObjectURL(file);
  }

  function shoeCard(s, retired) {
    var miles = Math.round((s.lifetimeMiles || 0) * 10) / 10;
    var goal = (s.goal && s.goal > 0) ? s.goal : WEAR_TARGET;
    var pct = Math.min(100, (miles / goal) * 100);
    var wearCls = miles >= goal ? 'over' : (miles >= goal * 0.8 ? 'warn' : '');
    // Title = brand + model, with the colorway peeled off (it gets its own
    // line); the copy number is shown on the photo badge, not in text.
    var brand = s.brand || '';
    var model = s.model || '';
    var color = s.color || '';
    var titleModel = model;
    if (color) {
      var re = new RegExp('\\s*' + color.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*$', 'i');
      titleModel = model.replace(re, '').trim();
    }
    var title = (brand + ' ' + titleModel).trim() || s.name || 'Unnamed pair';

    var whenHtml = '';
    if (retired && s.retired) {
      whenHtml = esc(mdy(s.purchased) + ' – ' + mdy(s.retired));
      if (s.purchased) {
        whenHtml += '<div class="shoe-dur">' + esc(durUsed(s.purchased, s.retired)) + ' used</div>';
      }
    } else if (s.purchased) {
      whenHtml = esc('Purchased ' + fmtDate(s.purchased));
    }

    var photo = s.photo
      ? '<img src="' + esc(s.photo) + '" alt="' + esc(s.name) + '">'
      : '<span class="ph">&#128095;</span>';
    var pairNum = (s.pair != null && s.pair !== '') ? String(s.pair)
                : (String(s.model || s.name || '').match(/#(\d+)\s*$/) || [])[1];
    // Only badge #2 and up — a lone/first pair shows no number.
    var badge = (pairNum && parseInt(pairNum, 10) >= 2)
              ? '<span class="shoe-num">' + esc(pairNum) + '</span>' : '';

    return '' +
      '<div class="shoe-card reveal' + (retired ? ' retired' : '') + '" data-name="' + esc(s.name) + '">' +
        '<div class="shoe-photo">' + photo + badge + '</div>' +
        '<div class="shoe-body">' +
          '<div class="shoe-name">' + esc(title) + '</div>' +
          (color ? '<div class="shoe-color">' + esc(color) + '</div>' : '') +
          '<div class="shoe-walks">' + (s.walks || 0) + (s.walks === 1 ? ' walk' : ' walks') + '</div>' +
          '<div class="shoe-miles">' + miles.toFixed(1) + ' <span>/ ' + goal + ' mi</span></div>' +
          '<div class="wear-track"><div class="wear-fill ' + wearCls + '" style="width:' + pct + '%"></div></div>' +
          (whenHtml ? '<div class="shoe-when">' + whenHtml + '</div>' : '') +
        '</div>' +
      '</div>';
  }

  function render(shoes) {
    allShoes = shoes || [];
    var current = [], retired = [];
    allShoes.forEach(function(s) { (s.retired ? retired : current).push(s); });

    document.getElementById('current-list').innerHTML = current.length
      ? current.map(function(s) { return shoeCard(s, false); }).join('')
      : '<div class="empty-note">No active pairs yet — add one below.</div>';

    var rw = document.getElementById('retired-wrap');
    if (retired.length) {
      document.getElementById('retired-list').innerHTML =
        retired.map(function(s) { return shoeCard(s, true); }).join('');
      document.getElementById('toggle-retired').style.display = '';
    } else {
      rw.classList.remove('open');
      document.getElementById('toggle-retired').style.display = 'none';
    }

    // Stagger the cards in
    var cards = document.querySelectorAll('.shoe-card.reveal');
    cards.forEach(function(c, i) {
      setTimeout(function() { c.classList.remove('reveal'); }, 80 + i * 70);
    });
  }

  function load() {
    startLoader();
    MilesTracker.fetchShoes(function(shoes) {
      shoes = shoes || [];
      // Count walks per pair on the client (same name/model/brand+model match
      // the backend uses for miles) — avoids another Apps Script redeploy.
      MilesTracker.fetchAllEntries(function(rows) {
        var cnt = {};
        (rows || []).forEach(function(r) {
          if (!r.shoe) return;
          var k = String(r.shoe).trim().toLowerCase();
          cnt[k] = (cnt[k] || 0) + 1;
        });
        shoes.forEach(function(s) {
          // Use the exact label set the backend matches miles on.
          var keys = s.matchKeys || [s.name, s.model];
          var seen = {}, n = 0;
          keys.forEach(function(key) {
            key = String(key || '').trim().toLowerCase();
            if (!key || seen[key]) return;
            seen[key] = true;
            n += cnt[key] || 0;
          });
          s.walks = n;
        });
        render(shoes);
        stopLoader();
      });
    });
  }

  // ---------- show retired toggle ----------
  document.getElementById('toggle-retired').addEventListener('click', function() {
    var rw = document.getElementById('retired-wrap');
    var open = rw.classList.toggle('open');
    this.textContent = open ? 'Hide retired' : 'Show retired';
  });

  // ---------- add-pair sheet ----------
  var backdrop = document.getElementById('add-backdrop');
  var addSheet = document.getElementById('add-sheet');
  var brandEl  = document.getElementById('sh-brand');
  var modelEl  = document.getElementById('sh-model');
  var colorEl  = document.getElementById('sh-color');
  var goalEl   = document.getElementById('sh-goal');
  var dateEl   = document.getElementById('sh-date');
  var saveBtn  = document.getElementById('add-save');
  var addPhoto = null;

  var today = new Date();
  var iso = today.getFullYear() + '-' +
    ('0' + (today.getMonth() + 1)).slice(-2) + '-' +
    ('0' + today.getDate()).slice(-2);
  dateEl.value = iso; dateEl.max = iso;

  function openAdd()  { backdrop.classList.add('show');    addSheet.classList.add('show'); }
  function closeAdd() { backdrop.classList.remove('show'); addSheet.classList.remove('show'); }
  function refreshSaveState() {
    saveBtn.disabled = !((brandEl.value.trim() || modelEl.value.trim()) && dateEl.value);
  }

  document.getElementById('open-add').addEventListener('click', openAdd);
  document.getElementById('add-cancel').addEventListener('click', closeAdd);
  [brandEl, modelEl, dateEl].forEach(function(el) {
    el.addEventListener('input', refreshSaveState);
  });

  document.getElementById('sh-photo').addEventListener('change', function(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    cropToSquare(file, function(url) {
      if (!url) { pill('Could not read that photo'); return; }
      addPhoto = url;
      var pv = document.getElementById('photo-preview');
      pv.src = url; pv.style.display = 'block';
      document.getElementById('photo-hint').style.display = 'none';
    });
  });

  saveBtn.addEventListener('click', function() {
    var brand = brandEl.value.trim(), model = modelEl.value.trim();
    if (!(brand || model) || !dateEl.value) return;
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    MilesTracker.addShoe({
      brand: brand, model: model, purchased: dateEl.value,
      color: colorEl.value.trim(),
      goal: goalEl.value ? parseInt(goalEl.value, 10) : '',
      photo: addPhoto
    }, function(ok, res) {
      saveBtn.textContent = 'Save pair';
      if (!ok) { saveBtn.disabled = false; pill(res || 'Could not save — try again', true); return; }
      closeAdd();
      brandEl.value = modelEl.value = colorEl.value = goalEl.value = '';
      addPhoto = null;
      document.getElementById('photo-preview').style.display = 'none';
      document.getElementById('photo-hint').style.display = '';
      dateEl.value = iso;
      pill((res && res.photoError) ? ('Pair saved — photo failed: ' + res.photoError) : 'Pair added',
           !!(res && res.photoError));
      load();
    });
  });

  // ---------- tap a shoe → action sheet (change photo / retire) ----------
  var actSheet  = document.getElementById('act-sheet');
  var actTitle  = document.getElementById('act-title');
  var actRetire = document.getElementById('act-retire');
  var currentName = null;

  function openAct(name) {
    var s = allShoes.filter(function(x) { return x.name === name; })[0];
    if (!s) return;
    currentName = name;
    actTitle.textContent = name;
    actRetire.style.display = s.retired ? 'none' : '';
    backdrop.classList.add('show'); actSheet.classList.add('show');
  }
  function closeAct() { backdrop.classList.remove('show'); actSheet.classList.remove('show'); }

  backdrop.addEventListener('click', function() { closeAdd(); closeAct(); });

  document.getElementById('shoes-shell').addEventListener('click', function(e) {
    var card = e.target.closest('.shoe-card');
    if (card) openAct(card.getAttribute('data-name'));
  });
  document.getElementById('act-cancel').addEventListener('click', closeAct);

  document.getElementById('act-photo').addEventListener('click', function() {
    document.getElementById('act-photo-input').click();
  });
  document.getElementById('act-photo-input').addEventListener('change', function(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || !currentName) return;
    cropToSquare(file, function(url) {
      if (!url) { pill('Could not read that photo'); return; }
      pill('Updating photo…', true);
      MilesTracker.updateShoe({ name: currentName, photo: url }, function(ok, res) {
        closeAct();
        if (!ok) { pill(res || 'Could not update photo', true); return; }
        if (res && res.photoError) { pill('Photo failed: ' + res.photoError, true); return; }
        pill('Photo updated'); load();
      });
    });
  });

  actRetire.addEventListener('click', function() {
    if (!currentName) return;
    pill('Retiring…', true);
    MilesTracker.updateShoe({ name: currentName, retire: true }, function(ok, err) {
      closeAct();
      if (!ok) { pill(err || 'Could not retire', true); return; }
      pill('Retired'); load();
    });
  });

  MilesTracker.onReady = function() { load(); };
  MilesTracker.init();

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mock C — Activity feed</title>
<link rel="stylesheet" href="https://use.typekit.net/ymz2nvi.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f1ebdd;color:#171717;min-height:100vh;
    font-family:"omnes",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    padding-bottom:88px;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:-1;transform:translateY(60px);
    background:linear-gradient(159deg,transparent 0 76.6%,#016074 76.6% 78.8%,#94D3BE 78.8% 81.1%,
    #E7D7A4 81.1% 83.9%,#EB9A00 83.9% 86.6%,#CA6902 86.6% 89.3%,#B02113 89.3% 100%)}
  .wrap{max-width:560px;margin:0 auto;padding:1.7rem 1.2rem 1rem}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
  .wm{font-weight:900;font-size:1.7rem;color:#C77A0C;letter-spacing:.01em}
  .logmini{background:#E89A1F;color:#1a1a1a;border:none;border-radius:12px;padding:.6rem 1rem;
    font-family:inherit;font-weight:900;font-size:.85rem;letter-spacing:.03em;
    box-shadow:0 4px 0 #b9760f;cursor:pointer}
  .strip{display:flex;gap:1.3rem;font-size:.8rem;font-weight:800;margin-bottom:1.1rem;
    padding-bottom:1rem;border-bottom:1px solid rgba(0,0,0,.1)}
  .strip b{font-size:1rem}.strip span{opacity:.5;font-weight:700}
  .hero{background:#fffdf7;border:1px solid rgba(0,0,0,.08);border-radius:18px;overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:1.1rem}
  .map{height:170px;background:#dfe9e2;position:relative}
  .map svg{position:absolute;inset:0}
  .hero-b{padding:1rem 1.1rem 1.15rem}
  .hero-mi{font-size:2.4rem;font-weight:900;letter-spacing:-.02em;line-height:1}
  .hero-mi small{font-size:.9rem;font-weight:800;opacity:.45}
  .hero-meta{display:flex;gap:1.1rem;margin-top:.55rem;font-size:.82rem;font-weight:700;opacity:.7}
  .hero-shoe{margin-top:.7rem;font-size:.78rem;font-weight:800;opacity:.55;letter-spacing:.03em}
  .eh{font-size:.62rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    opacity:.45;margin:.2rem 0 .7rem}
  .row{display:flex;align-items:center;justify-content:space-between;background:#fffdf7;
    border:1px solid rgba(0,0,0,.07);border-radius:12px;padding:.8rem 1rem;margin-bottom:.6rem}
  .row .l{font-weight:900;font-size:1.05rem}
  .row .l small{font-size:.72rem;font-weight:800;opacity:.4;margin-left:.3rem}
  .row .pill{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
    background:#8FCFC2;color:#16302b;padding:3px 9px;border-radius:999px}
  .row .pill.run{background:#E7D7A4}
  .row .d{font-size:.72rem;font-weight:700;opacity:.45}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:#fffdf7;display:flex;justify-content:center;
    gap:14px;padding:.5rem 0 1.4rem;box-shadow:0 -3px 12px rgba(0,0,0,.08);border-radius:14px 14px 0 0}
  .tab{width:64px;text-align:center;font-size:.55rem;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;opacity:.45;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tab.on{opacity:1;color:#C77A0C}.tab b{font-size:1.1rem}
  .flag{position:fixed;top:8px;left:8px;background:#171717;color:#fff;font-size:.6rem;
    font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:6px;font-family:system-ui}
</style>
</head>
<body>
<div class="bg"></div>
<div class="flag">MOCK C · ACTIVITY FEED</div>
<div class="wrap">
  <div class="top">
    <div class="wm">MILEAGE</div>
    <button class="logmini">+ LOG</button>
  </div>
  <div class="strip"><span><b>295.1</b> mi</span><span><b>70</b> days</span>
    <span><b>51%</b></span><span>🔥<b>4</b></span></div>

  <div class="hero">
    <div class="map">
      <svg viewBox="0 0 400 170" preserveAspectRatio="none">
        <path d="M40 140 C90 60,140 160,200 90 S320 40,360 110" fill="none"
          stroke="#C77A0C" stroke-width="4" stroke-linecap="round"/>
        <circle cx="40" cy="140" r="6" fill="#0E7A8C"/>
        <circle cx="360" cy="110" r="6" fill="#B02113"/>
      </svg>
    </div>
    <div class="hero-b">
      <div class="hero-mi">5.23 <small>mi</small></div>
      <div class="hero-meta"><span>May 18 · 6:30 AM</span><span>16:49 /mi</span><span>☁ 67°</span></div>
      <div class="hero-shoe">👟 Nike Pegasus Volt (3)</div>
    </div>
  </div>

  <div class="eh">Earlier</div>
  <div class="row"><div class="l">3.12 <small>mi</small></div>
    <span class="pill">Walk</span><div class="d">May 16</div></div>
  <div class="row"><div class="l">4.01 <small>mi</small></div>
    <span class="pill run">Run</span><div class="d">May 15</div></div>
  <div class="row"><div class="l">2.80 <small>mi</small></div>
    <span class="pill">Walk</span><div class="d">May 14</div></div>
</div>

<div class="tabs">
  <div class="tab"><b>▣</b>Stats</div><div class="tab"><b>📈</b>Trends</div>
  <div class="tab on"><b>＋</b>Entry</div><div class="tab"><b>〜</b>Activity</div>
  <div class="tab"><b>👟</b>Shoes</div>
</div>
</body>
</html>

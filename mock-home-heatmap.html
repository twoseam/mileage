<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mock B — Year heatmap</title>
<link rel="stylesheet" href="https://use.typekit.net/ymz2nvi.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f1ebdd;color:#171717;min-height:100vh;
    font-family:"omnes",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    padding-bottom:88px;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:-1;transform:translateY(60px);
    background:linear-gradient(159deg,transparent 0 76.6%,#016074 76.6% 78.8%,#94D3BE 78.8% 81.1%,
    #E7D7A4 81.1% 83.9%,#EB9A00 83.9% 86.6%,#CA6902 86.6% 89.3%,#B02113 89.3% 100%)}
  .wrap{max-width:560px;margin:0 auto;padding:2.2rem 1.3rem 1rem;text-align:center}
  .wm{font-weight:900;font-size:clamp(2.4rem,10vw,3.3rem);color:#C77A0C;letter-spacing:.01em}
  .strip{display:flex;justify-content:center;gap:1.6rem;margin:.7rem 0 1.6rem;
    font-size:.82rem;font-weight:800}
  .strip b{font-size:1.05rem}.strip span{opacity:.5;font-weight:700}
  .cal{background:#fffdf7;border:1px solid rgba(0,0,0,.08);border-radius:16px;
    padding:1.1rem 1rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .mo{display:flex;align-items:center;gap:.5rem;margin:.28rem 0}
  .mo .nm{width:34px;text-align:left;font-size:.62rem;font-weight:800;opacity:.5;
    text-transform:uppercase;letter-spacing:.08em}
  .grid{display:flex;gap:3px;flex-wrap:wrap}
  .d{width:100%;flex:1;aspect-ratio:1;border-radius:2px;background:rgba(0,0,0,.07);min-width:6px}
  .d.w{background:#8FCFC2}.d.r{background:#E7D7A4}.d.t{background:#C77A0C}
  .legend{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:1rem;
    font-size:.6rem;font-weight:700;opacity:.5;letter-spacing:.08em;text-transform:uppercase}
  .legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
  .log{display:block;width:100%;max-width:420px;margin:1.6rem auto 0;padding:1.15rem;
    background:#E89A1F;color:#1a1a1a;border:none;border-radius:16px;font-family:inherit;
    font-size:1.05rem;font-weight:900;letter-spacing:.04em;box-shadow:0 5px 0 #b9760f;cursor:pointer}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:#fffdf7;display:flex;justify-content:center;
    gap:14px;padding:.5rem 0 1.4rem;box-shadow:0 -3px 12px rgba(0,0,0,.08);border-radius:14px 14px 0 0}
  .tab{width:64px;text-align:center;font-size:.55rem;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;opacity:.45;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tab.on{opacity:1;color:#C77A0C}.tab b{font-size:1.1rem}
  .flag{position:fixed;top:8px;left:8px;background:#171717;color:#fff;font-size:.6rem;
    font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:6px;font-family:system-ui}
</style>
</head>
<body>
<div class="bg"></div>
<div class="flag">MOCK B · YEAR HEATMAP</div>
<div class="wrap">
  <div class="wm">MILEAGE</div>
  <div class="strip"><span><b>295.1</b> mi</span><span><b>70</b> days</span><span><b>51%</b> of year</span></div>

  <div class="cal" id="cal"></div>

  <div class="legend"><i style="background:rgba(0,0,0,.07)"></i>none
    <i style="background:#8FCFC2"></i>walk <i style="background:#E7D7A4"></i>run
    <i style="background:#C77A0C"></i>today</div>

  <button class="log">+ LOG A WALK</button>
</div>

<div class="tabs">
  <div class="tab"><b>▣</b>Stats</div><div class="tab"><b>📈</b>Trends</div>
  <div class="tab on"><b>＋</b>Entry</div><div class="tab"><b>〜</b>Activity</div>
  <div class="tab"><b>👟</b>Shoes</div>
</div>
<script>
/* static visual only — pseudo-random fill so it reads like a real year */
var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var days=[31,28,31,30,31,30,31,31,30,31,30,31],html='',seed=7;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
for(var m=0;m<12;m++){
  html+='<div class="mo"><div class="nm">'+mo[m]+'</div><div class="grid">';
  for(var d=0;d<days[m];d++){
    var c='';
    if(m>4){c='';}                                  // future months empty
    else if(m===4&&d>17){c='';}                     // mid-May onward empty
    else{var x=rnd();c=x>0.55?'w':(x>0.42?'r':'');} // ~50% active
    if(m===4&&d===17)c='t';                          // today
    html+='<span class="d '+c+'"></span>';
  }
  html+='</div></div>';
}
document.getElementById('cal').innerHTML=html;
</script>
</body>
</html>

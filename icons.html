<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon auditions — Mileage</title>
  <link rel="stylesheet" href="https://use.typekit.net/ymz2nvi.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #f5f5f5;
      font-family: "omnes", -apple-system, sans-serif;
      padding: 3rem 1.5rem;
      text-align: center;
      min-height: 100vh;
    }
    h1 {
      font-weight: 900;
      font-size: 2rem;
      margin: 0 0 0.5rem;
    }
    .lede {
      opacity: 0.6;
      font-size: 0.95rem;
      margin: 0 0 3rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 2.5rem;
      max-width: 700px;
      margin: 0 auto;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon {
      width: 180px;
      height: 180px;
      border-radius: 22.37%;
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .label {
      margin-top: 0.85rem;
      font-size: 0.85rem;
      opacity: 0.75;
      letter-spacing: 0.04em;
    }

    /* A — Big M on mustard */
    .icon-a { background: #E89A1F; }
    .icon-a span {
      font-weight: 900;
      font-size: 145px;
      color: #1a1a1a;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-top: -8px;
    }

    /* B — Diagonal stripes, full-bleed */
    .icon-b {
      background:
        linear-gradient(
          135deg,
          #016074 0%, #016074 16.67%,
          #94D3BE 16.67%, #94D3BE 33.33%,
          #E7D7A4 33.33%, #E7D7A4 50%,
          #EB9A00 50%, #EB9A00 66.67%,
          #CA6902 66.67%, #CA6902 83.33%,
          #B02113 83.33%, #B02113 100%
        );
    }

    /* C — M on diagonal stripes */
    .icon-c {
      background:
        linear-gradient(
          135deg,
          #016074 0%, #016074 16.67%,
          #94D3BE 16.67%, #94D3BE 33.33%,
          #E7D7A4 33.33%, #E7D7A4 50%,
          #EB9A00 50%, #EB9A00 66.67%,
          #CA6902 66.67%, #CA6902 83.33%,
          #B02113 83.33%, #B02113 100%
        );
    }
    .icon-c span {
      font-weight: 900;
      font-size: 130px;
      color: #1a1a1a;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-top: -6px;
      text-shadow: 0 0 24px rgba(0, 0, 0, 0.18);
    }

    /* D — "26" on teal with mustard accent stripe */
    .icon-d {
      background: #016074;
      flex-direction: column;
      gap: 0;
    }
    .icon-d span {
      font-weight: 900;
      font-size: 110px;
      color: #EB9A00;
      line-height: 1;
      letter-spacing: -0.04em;
      margin-top: -2px;
    }
    .icon-d small {
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 0.18em;
      color: #94D3BE;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Icon auditions</h1>
  <p class="lede">Imagine each on your iPhone home screen.</p>

  <div class="grid">
    <div class="card">
      <div class="icon icon-a"><span>M</span></div>
      <div class="label">A — Bold M on mustard</div>
    </div>
    <div class="card">
      <div class="icon icon-b"></div>
      <div class="label">B — Stripes only</div>
    </div>
    <div class="card">
      <div class="icon icon-c"><span>M</span></div>
      <div class="label">C — M on stripes</div>
    </div>
    <div class="card">
      <div class="icon icon-d"><span>26</span><small>MILEAGE</small></div>
      <div class="label">D — Year badge</div>
    </div>
  </div>
</body>
</html>

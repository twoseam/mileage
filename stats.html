<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mileage — Stats</title>

  <meta name="description" content="Mileage trends — walks and runs by week, month, year, and all-time.">
  <link rel="canonical" href="https://twoseam.github.io/mileage/stats.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mileage">
  <meta property="og:title" content="Mileage — Stats">
  <meta property="og:description" content="Mileage trends — walks and runs by week, month, year, and all-time.">
  <meta property="og:url" content="https://twoseam.github.io/mileage/stats.html">
  <meta property="og:image" content="https://twoseam.github.io/mileage/apple-touch-icon-1024.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Mileage — Stats">
  <meta name="twitter:description" content="Mileage trends — walks and runs by week, month, year, and all-time.">
  <meta name="twitter:image" content="https://twoseam.github.io/mileage/apple-touch-icon-1024.png">
  <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mileage">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#252525">

  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://p.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/ymz2nvi.css">

  <script src="miles-tracker.js"></script>
  <script src="nav.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scrollbar-width: none; -ms-overflow-style: none; }
    body::-webkit-scrollbar { display: none; }
    body {
      background: #252525;
      color: #f5f5f5;
      font-family: "omnes", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .mt-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      transform: translateY(50px);
      background: linear-gradient(
        159deg,
        transparent 0%, transparent 76.6%,
        #016074 76.6%, #016074 78.8%,
        #94D3BE 78.8%, #94D3BE 81.1%,
        #E7D7A4 81.1%, #E7D7A4 83.9%,
        #EB9A00 83.9%, #EB9A00 86.6%,
        #CA6902 86.6%, #CA6902 89.3%,
        #B02113 89.3%, #B02113 100%
      );
    }

    .wordmark {
      max-width: 720px;
      margin: 2.5rem auto 1.5rem;
      padding: 0 2rem;
      text-align: center;
      font-family: "omnes", system-ui, sans-serif;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 0.01em;
    }
    .wordmark-year {
      font-size: clamp(2.5rem, 10vw, 4rem);
      color: #8FCFC2;
      margin-bottom: 0.1em;
    }
    .wordmark-title {
      font-size: clamp(2.5rem, 10vw, 4rem);
      color: #E89A1F;
    }
    .page-title {
      font-size: 0.65rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-top: 1rem;
      font-weight: 700;
    }

    #stats-shell {
      max-width: 880px;
      margin: 0 auto;
      padding: 4.5rem 0.9rem 2.5rem;
    }

    /* Period navigation */
    .range-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      min-height: 36px;
    }
    .range-arrow {
      background: none;
      border: none;
      color: inherit;
      width: 36px; height: 36px;
      font-size: 1.4rem;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.15s ease;
      padding: 0;
    }
    .range-arrow:hover { opacity: 1; }
    .range-arrow:disabled { opacity: 0.15; cursor: not-allowed; }
    .range-label {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      min-width: 180px;
      text-align: center;
    }

    /* Chart */
    .chart-card {
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 1.1rem 0.85rem 0.75rem;
      margin-bottom: 1.25rem;
      position: relative;            /* anchor for the long-press preview */
    }
    .bar-pop {
      position: absolute;
      z-index: 50;
      background: #f5f0e6;
      color: #1a1a1a;
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 130px;
      font-size: 0.72rem;
      line-height: 1.4;
      white-space: nowrap;
      box-shadow: 0 10px 28px rgba(0,0,0,0.4);
      transform: translate(-50%, -100%) scale(0.9);
      transform-origin: center bottom;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease, transform 0.12s ease;
    }
    .bar-pop.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
    .bar-pop .bp-title {
      font-weight: 800;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.55;
      margin-bottom: 4px;
    }
    .bar-pop .bp-row { display: flex; justify-content: space-between; gap: 16px; }
    .bar-pop .bp-row b { font-weight: 800; }
    .bar-pop .bp-total {
      margin-top: 4px;
      border-top: 1px solid rgba(0,0,0,0.12);
      padding-top: 4px;
    }
    .bar-pop .bp-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 2px;
      margin-right: 6px;
      vertical-align: middle;
    }
    .chart-summary {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .chart-summary > div { display: flex; flex-direction: column; gap: 2px; }
    .chart-summary-label {
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.5;
    }
    .chart-summary-value {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;   /* digits don't jitter while counting */
      display: inline-block;
    }
    #summary-miles { min-width: 4.2ch; }    /* hold the cell width steady */
    #summary-days  { min-width: 2.2ch; }
    .chart-legend {
      margin-left: auto;
      display: flex;
      gap: 0.9rem;
      align-items: center;
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      opacity: 0.75;
      padding-bottom: 4px;
    }
    .chart-legend-swatch {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .chart-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 240px;
      padding-top: 18px;
      padding-left: 22px;   /* clear the scale column so bars never cover it */
    }
    .chart-bar {
      flex: 1;
      min-height: 1px;
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: 4px 4px 0 0;
      overflow: hidden;
      transition: height 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: default;
    }
    .chart-bar.is-drillable { cursor: pointer; }
    .chart-bar:hover { filter: brightness(1.1); }
    .chart-bar-seg { width: 100%; }
    .chart-bar-seg-walk { background: #8FCFC2; }  /* cyan */
    .chart-bar-seg-run  { background: #E7D7A4; }  /* cream */
    /* Current period: yellow duotone so it pops AND still shows walk/run split */
    .chart-bar.is-current .chart-bar-seg-walk { background: #F7C948; }
    .chart-bar.is-current .chart-bar-seg-run  { background: #C77A0C; }
    .chart-bar-value {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.6rem;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    .chart-bar.show-value .chart-bar-value,
    .chart-bar:hover .chart-bar-value { opacity: 1; }

    .chart-labels {
      display: flex;
      gap: 3px;
      margin-top: 6px;
      padding-bottom: 4px;
      padding-left: 22px;   /* align day labels under the indented bars */
    }
    .chart-label {
      flex: 1;
      text-align: center;
      font-size: 0.55rem;
      opacity: 0.55;
      line-height: 1;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      transition: color 0.15s ease, opacity 0.15s ease;
    }
    .chart-label.is-current {
      color: #E89A1F;
      opacity: 1;
      font-weight: 800;
    }

    /* Value scale: faint horizontal lines behind the bars */
    .chart-plot { position: relative; }
    .chart-grid {
      position: absolute;
      left: 0; right: 0;
      top: 18px;          /* matches .chart-bars padding-top so 100% = scale max */
      bottom: 0;
      pointer-events: none;
    }
    .chart-gridline {
      position: absolute;
      left: 22px; right: 0;            /* line starts after the scale column */
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }
    .chart-gridline-minor { border-top-color: rgba(255, 255, 255, 0.035); }
    .chart-gridline span {
      position: absolute;
      left: -22px;
      width: 20px;
      text-align: left;   /* left edge lines up with "MILES" above */
      transform: translateY(-50%);
      font-size: 0.5rem;
      letter-spacing: 0.04em;
      color: rgba(245, 245, 245, 0.32);
    }

    /* Swipeable carousel: 3 panes (prev / current / next) on a track */
    .chart-viewport {
      overflow: hidden;
      touch-action: pan-y;          /* vertical scroll stays, horizontal is ours */
      cursor: grab;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;  /* no iOS text-select/callout on long-press */
    }
    .chart-viewport:active { cursor: grabbing; }
    .chart-track {
      display: flex;
      width: 300%;
      transform: translateX(-33.3333%);
      will-change: transform;
    }
    .chart-pane { flex: 0 0 33.3333%; width: 33.3333%; }

    /* Zoom buttons */
    .zoom-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .zoom-btn {
      flex: 1;
      max-width: 120px;
      padding: 10px 14px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: inherit;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0.55;
      /* No transition: iOS Safari can drop the final frame of a transitioned
         background change, leaving the old button visually filled. */
      transition: none;
    }
    /* Only brighten on hover for real pointers — touch screens keep :hover
       "stuck" after a tap, which made every tapped button look selected. */
    @media (hover: hover) and (pointer: fine) {
      .zoom-btn:hover { opacity: 1; }
    }
    .zoom-btn.is-active {
      background: #E89A1F;
      color: #1a1a1a;
      opacity: 1;
    }

    /* Recent runs list (under the chart) */
    .recent { margin-top: 1.6rem; }
    .recent-head {
      font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase;
      font-weight: 800; opacity: 0.5; margin: 0 0 0.7rem 2px;
    }
    .recent-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
    }
    .recent-card {
      background: #1f1f1f;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 1.15rem 1.2rem;
      min-height: 100px;
      display: flex; flex-direction: column; justify-content: center;
      gap: 0.4rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .recent-card:active { transform: scale(0.985); }
    @media (hover: hover) and (pointer: fine) {
      .recent-card:hover { background: #262626; }
    }
    .rc-miles {
      font-size: 1.5rem; font-weight: 900; letter-spacing: 0.01em;
      line-height: 1; white-space: nowrap;
    }
    .rc-miles span { font-size: 0.58rem; font-weight: 700; opacity: 0.5; margin-left: 3px; }
    .rc-top { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
    .rc-date { font-size: 0.98rem; font-weight: 800; letter-spacing: 0.01em; }
    .rc-type {
      font-size: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase;
      font-weight: 800; padding: 2px 7px; border-radius: 999px;
      color: #1a1a1a; background: #8FCFC2;
    }
    .rc-type.run { background: #E7D7A4; }
    .rc-meta {
      font-size: 0.7rem; opacity: 0.55; letter-spacing: 0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%;
    }
    .recent-empty {
      grid-column: 1 / -1;
      opacity: 0.45; font-size: 0.85rem; padding: 0.6rem 2px;
    }
    .recent-more {
      display: block; width: 100%;
      margin-top: 0.8rem; padding: 12px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      color: inherit; font-family: inherit;
      font-size: 0.68rem; font-weight: 800;
      letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer; opacity: 0.7;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    .recent-more:hover { opacity: 1; }
    .recent-more[hidden] { display: none; }

    /* Run detail popup */
    #rstats {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0, 0, 0, 0.6);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 1.5rem;
    }
    #rstats.show { display: flex; }
    .rstats-card {
      background: #f6f1e7; color: #1a1a1a;
      width: 100%; max-width: 384px;
      border-radius: 22px;
      padding: 1.6rem 1.5rem 1.35rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      max-height: 85vh; overflow-y: auto;
    }
    .rstats-top {
      display: flex; align-items: baseline; gap: 0.6rem;
      margin-bottom: 0.15rem;
    }
    .rstats-title { font-size: 1.35rem; font-weight: 900; letter-spacing: 0.01em; }
    .rstats-type {
      font-size: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase;
      font-weight: 800; padding: 2px 7px; border-radius: 999px;
      color: #1a1a1a; background: #8FCFC2;
    }
    .rstats-type.run { background: #E7D7A4; }
    .rstats-hero {
      font-size: 2.6rem; font-weight: 900; letter-spacing: 0.01em;
      margin: 0.4rem 0 1rem;
    }
    .rstats-hero span { font-size: 0.85rem; font-weight: 700; opacity: 0.5; margin-left: 5px; }
    .rstats-shoe {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.6rem;
      margin-top: 1rem; padding-top: 1.1rem;
      border-top: 1px solid rgba(0, 0, 0, 0.10);
    }
    .rstats-shoe img {
      width: 200px; max-width: 70%;
      aspect-ratio: 1 / 1; object-fit: cover;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.06);
    }
    .rstats-shoe .sn {
      font-size: 0.8rem; font-weight: 700; opacity: 0.6;
      letter-spacing: 0.02em; text-align: center;
    }
    .rstats-map {
      height: 220px; width: 100%;
      margin-top: 1rem; border-radius: 14px;
      overflow: hidden; background: rgba(0, 0, 0, 0.06);
    }
    .rstats-row {
      display: flex; justify-content: space-between; gap: 1rem;
      padding: 0.6rem 0;
      border-top: 1px solid rgba(0, 0, 0, 0.10);
      font-size: 0.92rem;
    }
    .rstats-row .k {
      text-transform: uppercase; letter-spacing: 0.08em;
      font-size: 0.62rem; font-weight: 800; opacity: 0.5;
      align-self: center;
    }
    .rstats-row .v { font-weight: 700; text-align: right; }
    .rstats-row .v a { color: #016074; text-decoration: none; font-weight: 800; }
    .rstats-notes {
      margin-top: 0.5rem; padding-top: 0.7rem;
      border-top: 1px solid rgba(0, 0, 0, 0.10);
      font-size: 0.9rem; line-height: 1.5; opacity: 0.8;
      white-space: pre-wrap; word-break: break-word;
    }
    .rstats-close {
      display: block; width: 100%;
      margin-top: 1.3rem;
      padding: 13px;
      border: none; border-radius: 12px;
      background: #E89A1F; color: #1a1a1a;
      font-family: inherit; font-size: 0.8rem; font-weight: 900;
      letter-spacing: 0.12em; text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 0 #b9760f;
    }
    .rstats-close:active { transform: translateY(2px); box-shadow: 0 2px 0 #b9760f; }

    /* Loader */
    #mt-loader {
      position: fixed;
      inset: 0;
      background: #252525;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s ease;
    }
    #mt-loader.mt-loader-hide { opacity: 0; pointer-events: none; }
    .mt-loader-bar {
      width: 240px;
      height: 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .mt-loader-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(
        to right,
        #016074 0%,    #016074 16.67%,
        #94D3BE 16.67%, #94D3BE 33.33%,
        #E7D7A4 33.33%, #E7D7A4 50%,
        #EB9A00 50%,    #EB9A00 66.67%,
        #CA6902 66.67%, #CA6902 83.33%,
        #B02113 83.33%, #B02113 100%
      );
      background-size: 240px 100%;
      transition: width 0.3s ease-out;
    }

    .mt-footer { text-align: center; padding: 0 1.5rem 2rem; }
    .mt-build {
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      opacity: 0.18;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    .mt-footer .mt-ver {
      display: inline-block;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      opacity: 0.3;
      color: inherit;
      text-decoration: none;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      transition: opacity 0.2s ease;
    }
    .mt-footer .mt-ver:hover { opacity: 0.7; }

    /* ---------- LIGHT MODE (additive; dark rules above untouched) ---------- */
    html[data-theme="light"] .wordmark-year  { color: #0E7A8C; }
    html[data-theme="light"] .wordmark-title { color: #C77A0C; }
    html[data-theme="light"] .chart-card {
      background: #fffdf7; border-color: rgba(0, 0, 0, 0.08);
    }
    html[data-theme="light"] .chart-bar-value { color: #252525; }
    html[data-theme="light"] .chart-label.is-current { color: #C77A0C; }
    html[data-theme="light"] .chart-gridline { border-top-color: rgba(0, 0, 0, 0.10); }
    html[data-theme="light"] .chart-gridline-minor { border-top-color: rgba(0, 0, 0, 0.05); }
    html[data-theme="light"] .chart-gridline span { color: rgba(23, 23, 23, 0.55); }
    html[data-theme="light"] #mt-loader { background: #f1ebdd; }
    html[data-theme="light"] .mt-loader-bar { background: rgba(0, 0, 0, 0.10); }
    html[data-theme="light"] .recent-card {
      background: #fffdf7; border-color: rgba(0, 0, 0, 0.08);
    }
    @media (hover: hover) and (pointer: fine) {
      html[data-theme="light"] .recent-card:hover { background: #fffbf0; }
    }
    html[data-theme="light"] .recent-more { border-color: rgba(0, 0, 0, 0.18); }

    @media (min-width: 720px) {
      .chart-bars { height: 320px; gap: 5px; }
      .chart-bar-value { font-size: 0.7rem; }
      .chart-label { font-size: 0.65rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

<div class="mt-bg"></div>

<div id="mt-loader">
  <div class="mt-loader-bar"><div class="mt-loader-fill"></div></div>
</div>

<div id="stats-shell">

  <div class="range-nav">
    <button class="range-arrow" id="range-prev" aria-label="Previous">←</button>
    <div class="range-label" id="range-label">—</div>
    <button class="range-arrow" id="range-next" aria-label="Next">→</button>
  </div>

  <div class="chart-card">
    <div class="chart-summary">
      <div>
        <div class="chart-summary-label">Miles</div>
        <div class="chart-summary-value" id="summary-miles">—</div>
      </div>
      <div>
        <div class="chart-summary-label">Days</div>
        <div class="chart-summary-value" id="summary-days">—</div>
      </div>
      <div class="chart-legend">
        <span><span class="chart-legend-swatch" style="background:#8FCFC2"></span>Walk</span>
        <span><span class="chart-legend-swatch" style="background:#E7D7A4"></span>Run</span>
      </div>
    </div>
    <div class="chart-viewport" id="chart-viewport">
      <div class="chart-track" id="chart-track">
        <div class="chart-pane" data-pane="prev">
          <div class="chart-plot"><div class="chart-grid"></div><div class="chart-bars"></div></div>
          <div class="chart-labels"></div>
        </div>
        <div class="chart-pane" data-pane="center">
          <div class="chart-plot"><div class="chart-grid"></div><div class="chart-bars"></div></div>
          <div class="chart-labels"></div>
        </div>
        <div class="chart-pane" data-pane="next">
          <div class="chart-plot"><div class="chart-grid"></div><div class="chart-bars"></div></div>
          <div class="chart-labels"></div>
        </div>
      </div>
    </div>
    <div class="bar-pop" id="bar-pop"></div>
  </div>

  <div class="zoom-buttons">
    <button class="zoom-btn"           data-zoom="all"  >All</button>
    <button class="zoom-btn"           data-zoom="year" >Year</button>
    <button class="zoom-btn is-active" data-zoom="month">Month</button>
    <button class="zoom-btn"           data-zoom="week" >Week</button>
  </div>

  <section class="recent">
    <div class="recent-head">Recent</div>
    <div class="recent-list" id="recent-list"></div>
    <button class="recent-more" id="recent-more" type="button" hidden>Show more</button>
  </section>

</div>

<div id="rstats" aria-modal="true" role="dialog">
  <div class="rstats-card" id="rstats-card"></div>
</div>

<footer class="mt-footer">
  <a class="mt-ver" href="changelog.html">v3.0.1</a>
</footer>

<script>
(function() {
  'use strict';

  // ---------- date helpers ----------

  function pad2(n) { return String(n).padStart(2, '0'); }
  function fmtDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function parseDate(s) { return new Date(s + 'T12:00:00'); }
  function startOfWeek(d) {
    var s = new Date(d); s.setHours(12,0,0,0);
    s.setDate(s.getDate() - s.getDay());
    return s;
  }
  function addDays(d, n)   { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function addMonths(d, n) { var x = new Date(d); x.setMonth(x.getMonth() + n); return x; }
  function addYears(d, n)  { var x = new Date(d); x.setFullYear(x.getFullYear() + n); return x; }
  function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1, 12); }
  function startOfYear(d)  { return new Date(d.getFullYear(), 0, 1, 12); }
  function sameDate(a, b)  { return fmtDate(a) === fmtDate(b); }
  function sameMonth(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth(); }
  function sameYear(a, b)  { return a.getFullYear() === b.getFullYear(); }

  var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW_SHORT    = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var DOW_TINY     = ['S','M','T','W','T','F','S'];

  // ---------- state ----------

  var state = {
    zoom: 'month',                // 'week' | 'month' | 'year' | 'all' — default Month
    cursor: startOfMonth(new Date()), // anchor of current visible range
    dailyWalk: {},                // 'YYYY-MM-DD' -> walk miles that day
    dailyRun:  {},                // 'YYYY-MM-DD' -> run miles that day
    firstEntryDate: null          // earliest date with any entries
  };

  function dayTotal(k) { return (state.dailyWalk[k] || 0) + (state.dailyRun[k] || 0); }

  // ---------- loader ----------

  var loaderTimer = null, loaderValue = 0;
  function startLoader() {
    var fill = document.querySelector('.mt-loader-fill');
    if (!fill) return;
    loaderValue = 0; fill.style.width = '0%';
    loaderTimer = setInterval(function() {
      if (loaderValue >= 95) return;
      var step = Math.max(0.4, (95 - loaderValue) * 0.04);
      loaderValue += step;
      fill.style.width = loaderValue + '%';
    }, 100);
  }
  var loaderHidden = false;
  function stopLoader() {
    if (loaderHidden) return;
    loaderHidden = true;
    if (loaderWatchdog) { clearTimeout(loaderWatchdog); loaderWatchdog = null; }
    if (loaderTimer) { clearInterval(loaderTimer); loaderTimer = null; }
    var fill = document.querySelector('.mt-loader-fill');
    if (fill) fill.style.width = '100%';
    setTimeout(function() {
      var loader = document.getElementById('mt-loader');
      if (loader) loader.classList.add('mt-loader-hide');
    }, 350);
  }

  // ---------- data ----------

  var loaderWatchdog = null;
  function loadData() {
    loaderHidden = false;
    startLoader();
    loadRecentShoes();
    // Never let a hung/slow cold-start fetch trap the loader forever.
    if (loaderWatchdog) clearTimeout(loaderWatchdog);
    loaderWatchdog = setTimeout(stopLoader, 18000);
    MilesTracker.fetchAllEntries(function(rows) {
      try {
        rows = rows || [];
        var walk = {};
        var run  = {};
        var firstDate = null;
        rows.forEach(function(r) {
          if (!r.date) return;
          var miles = parseFloat(r.miles) || 0;
          var bucket = (r.type === 'Run') ? run : walk;
          bucket[r.date] = (bucket[r.date] || 0) + miles;
          if (!firstDate || r.date < firstDate) firstDate = r.date;
        });
        state.dailyWalk = walk;
        state.dailyRun  = run;
        state.firstEntryDate = firstDate;
        renderRecent(rows);
        render();
      } catch (err) {
        // a render error must not strand the loader
        if (window.console) console.error('stats render failed:', err);
      } finally {
        stopLoader();
      }
    });
  }

  // ---------- recent list (last 7 logged sessions, newest first) ----------

  function rcFmtDate(d) {
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
    if (!p) return d || '';
    var dt = new Date(+p[1], +p[2] - 1, +p[3], 12);
    return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function rcDMY(d) {
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
    return p ? (p[3] + '/' + p[2] + '/' + p[1]) : (d || '');
  }
  function rcFmt12(t) {
    var m = /^(\d{1,2}):(\d{2})/.exec(String(t || ''));
    if (!m) return '';
    var h = +m[1], ap = h < 12 ? 'AM' : 'PM', hh = h % 12;
    if (hh === 0) hh = 12;
    return hh + ':' + m[2] + ' ' + ap;
  }
  function rcTime(s, e) {
    s = rcFmt12(s); e = rcFmt12(e);
    if (s && e) {
      return (s.slice(-2) === e.slice(-2)) ? (s.slice(0, -3) + '–' + e) : (s + ' – ' + e);
    }
    return s || e || '';
  }
  function rcEsc(x) {
    return String(x).replace(/[&<>"]/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var rcRecent = [];
  var rcShown = 4;            // 2x2 to start
  var RC_PAGE = 4;            // reveal 4 more per "Show more"
  var RC_MAX  = 40;           // cap how far back the list goes
  var rcShoeByKey = {};       // normalized shoe tag -> shoe roster object

  function loadRecentShoes() {
    if (!MilesTracker.fetchShoes) return;
    MilesTracker.fetchShoes(function(shoes) {
      (shoes || []).forEach(function(s) {
        var keys = (s.matchKeys || []).slice();
        if (s.name) keys.push(s.name);
        if (s.display) keys.push(s.display);
        keys.forEach(function(k) {
          rcShoeByKey[String(k).trim().toLowerCase()] = s;
        });
      });
    });
  }

  function rcDrawCards() {
    var box = document.getElementById('recent-list');
    var more = document.getElementById('recent-more');
    if (!box) return;

    if (!rcRecent.length) {
      box.innerHTML = '<div class="recent-empty">No entries yet.</div>';
      if (more) more.hidden = true;
      return;
    }

    box.innerHTML = rcRecent.slice(0, rcShown).map(function(r, idx) {
      var isRun = r.type === 'Run';
      var miles = (parseFloat(r.miles) || 0).toFixed(1);
      return '' +
        '<div class="recent-card" data-idx="' + idx + '" role="button" tabindex="0">' +
          '<div class="rc-miles">' + miles + '<span>mi</span></div>' +
          '<div class="rc-top">' +
            '<span class="rc-date">' + rcEsc(rcFmtDate(r.date)) + '</span>' +
            '<span class="rc-type' + (isRun ? ' run' : '') + '">' +
              (isRun ? 'Run' : 'Walk') + '</span>' +
          '</div>' +
        '</div>';
    }).join('');

    if (more) more.hidden = rcShown >= rcRecent.length;
  }

  function renderRecent(rows) {
    rcRecent = rows
      .map(function(r, i) { return { r: r, i: i }; })
      .sort(function(a, b) {
        if (a.r.date !== b.r.date) return a.r.date < b.r.date ? 1 : -1;
        return b.i - a.i; // same day: later sheet row = logged later
      })
      .slice(0, RC_MAX)
      .map(function(x) { return x.r; });
    rcShown = 4;
    rcDrawCards();
  }

  (function wireRecentMore() {
    var more = document.getElementById('recent-more');
    if (more) more.addEventListener('click', function() {
      rcShown = Math.min(rcShown + RC_PAGE, rcRecent.length);
      rcDrawCards();
    });
  })();

  // ---------- run detail popup ----------

  function rcRow(k, v) {
    if (v === '' || v == null) return '';
    return '<div class="rstats-row"><span class="k">' + k +
           '</span><span class="v">' + v + '</span></div>';
  }

  // ===== Google Maps (brand-styled). Paste your restricted Maps JS API
  // key below; until then the map silently no-ops (nothing else breaks). =====
  var GMAPS_KEY = '';   // <-- PASTE GOOGLE MAPS JS API KEY HERE

  // Retro brand palette: cream land, teal water, mustard roads, dark labels.
  var RS_BRAND_STYLE = [
    { elementType: 'geometry', stylers: [{ color: '#ECE0BE' }] },
    { elementType: 'labels.text.fill', stylers: [{ color: '#3A2E12' }] },
    { elementType: 'labels.text.stroke', stylers: [{ color: '#F4ECD3' }] },
    { elementType: 'labels.icon', stylers: [{ visibility: 'off' }] },
    { featureType: 'administrative', elementType: 'geometry.stroke',
      stylers: [{ color: '#B98A3C' }] },
    { featureType: 'landscape.natural', elementType: 'geometry',
      stylers: [{ color: '#DCD3A6' }] },
    { featureType: 'poi', stylers: [{ visibility: 'off' }] },
    { featureType: 'poi.park', elementType: 'geometry',
      stylers: [{ color: '#BFD8B8' }] },
    { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#E8C77A' }] },
    { featureType: 'road.arterial', elementType: 'geometry',
      stylers: [{ color: '#E3B45A' }] },
    { featureType: 'road.highway', elementType: 'geometry',
      stylers: [{ color: '#E89A1F' }] },
    { featureType: 'road', elementType: 'labels', stylers: [{ visibility: 'off' }] },
    { featureType: 'transit', stylers: [{ visibility: 'off' }] },
    { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#8FCFC2' }] }
  ];

  var _gmapsP = null;
  function loadGMaps() {
    if (_gmapsP) return _gmapsP;
    if (!GMAPS_KEY) return Promise.reject('no key');
    _gmapsP = new Promise(function(resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' +
              encodeURIComponent(GMAPS_KEY) + '&v=quarterly';
      s.async = true; s.defer = true;
      s.onload = function() {
        (window.google && google.maps) ? resolve(google.maps) : reject('gmaps not ready');
      };
      s.onerror = function() { reject('gmaps script failed'); };
      document.head.appendChild(s);
    });
    return _gmapsP;
  }

  var rsMap = null;
  function rsClearMap() { rsMap = null; }  // popup rebuilds the div each open

  function rsLoadRoute(aid) {
    fetch('routes/' + encodeURIComponent(aid) + '.json')
      .then(function(res) { if (!res.ok) throw 0; return res.json(); })
      .then(function(pts) {
        var el = document.getElementById('rstats-map');
        if (!el || !pts || pts.length < 2) return;
        loadGMaps().then(function(gm) {
          rsMap = new gm.Map(el, {
            mapTypeControl: false, streetViewControl: false,
            fullscreenControl: false, gestureHandling: 'greedy',
            backgroundColor: '#ECE0BE', styles: RS_BRAND_STYLE
          });
          var path = pts.map(function(p) { return { lat: p[0], lng: p[1] }; });
          new gm.Polyline({
            path: path, map: rsMap,
            strokeColor: '#B02113', strokeOpacity: 0.95, strokeWeight: 4
          });
          var b = new gm.LatLngBounds();
          path.forEach(function(p) { b.extend(p); });
          rsMap.fitBounds(b, 24);
        }).catch(function() {
          el.style.display = 'none';   // no key / load fail → hide the box
        });
      })
      .catch(function() { /* no route file for this entry — skip silently */ });
  }

  function openRunStats(idx) {
    var r = rcRecent[idx];
    if (!r) return;
    rsClearMap();
    var isRun = r.type === 'Run';
    var aid = String(r.activity_id || '').trim();
    var miles = (parseFloat(r.miles) || 0).toFixed(1);

    var dur = '';
    var sm = /^(\d{1,2}):(\d{2})/.exec(String(r.start_time || ''));
    var em = /^(\d{1,2}):(\d{2})/.exec(String(r.end_time || ''));
    if (sm && em) {
      var mins = (+em[1] * 60 + +em[2]) - (+sm[1] * 60 + +sm[2]);
      if (mins > 0) {
        var hh = Math.floor(mins / 60), mm = mins % 60;
        dur = (hh ? hh + 'h ' : '') + mm + 'm';
      }
    }
    var shoeBlock = '';
    if (r.shoe) {
      var shoeObj = rcShoeByKey[String(r.shoe).trim().toLowerCase()];
      var sname = rcEsc((shoeObj && (shoeObj.display || shoeObj.name)) || r.shoe);
      var simg = (shoeObj && shoeObj.photo)
        ? '<img src="' + rcEsc(shoeObj.photo) + '" alt="" loading="lazy">'
        : '';
      shoeBlock = '<div class="rstats-shoe">' + simg +
                  '<span class="sn">' + sname + '</span></div>';
    }

    var loc = '';
    if (r.lat != null && r.lon != null && r.lat !== '' && r.lon !== '') {
      var ll = (+r.lat).toFixed(4) + ', ' + (+r.lon).toFixed(4);
      loc = '<a href="https://www.openstreetmap.org/?mlat=' + r.lat + '&mlon=' + r.lon +
            '#map=15/' + r.lat + '/' + r.lon + '" target="_blank" rel="noopener">' + ll + '</a>';
    }

    document.getElementById('rstats-card').innerHTML = '' +
      '<div class="rstats-top">' +
        '<span class="rstats-title">' + rcEsc(rcFmtDate(r.date)) + '</span>' +
        '<span class="rstats-type' + (isRun ? ' run' : '') + '">' +
          (isRun ? 'Run' : 'Walk') + '</span>' +
      '</div>' +
      '<div class="rstats-hero">' + miles + '<span>miles</span></div>' +
      rcRow('Date', rcEsc(rcDMY(r.date))) +
      rcRow('Type', isRun ? 'Run' : 'Walk') +
      rcRow('Distance', miles + ' mi') +
      rcRow('Pace', r.pace ? rcEsc(r.pace) + ' /mi' : '') +
      rcRow('Start', rcFmt12(r.start_time)) +
      rcRow('End', rcFmt12(r.end_time)) +
      rcRow('Duration', dur) +
      rcRow('Temp', (r.temp_f != null && r.temp_f !== '') ? Math.round(r.temp_f) + '°F' : '') +
      rcRow('Weather', r.weather ? rcEsc(r.weather) : '') +
      rcRow('Location', loc) +
      (r.notes ? '<div class="rstats-notes">' + rcEsc(r.notes) + '</div>' : '') +
      (aid ? '<div class="rstats-map" id="rstats-map"></div>' : '') +
      shoeBlock +
      '<button class="rstats-close" type="button">Close</button>';

    document.getElementById('rstats').classList.add('show');
    if (aid) rsLoadRoute(aid);
  }

  function closeRunStats() {
    document.getElementById('rstats').classList.remove('show');
    rsClearMap();
  }

  (function wireRunStats() {
    var list = document.getElementById('recent-list');
    if (list) {
      list.addEventListener('click', function(e) {
        var card = e.target.closest('.recent-card');
        if (card && card.hasAttribute('data-idx')) openRunStats(+card.getAttribute('data-idx'));
      });
      list.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        var card = e.target.closest('.recent-card');
        if (card && card.hasAttribute('data-idx')) { e.preventDefault(); openRunStats(+card.getAttribute('data-idx')); }
      });
    }
    var modal = document.getElementById('rstats');
    if (modal) {
      modal.addEventListener('click', function(e) {
        if (e.target === modal || e.target.classList.contains('rstats-close')) closeRunStats();
      });
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeRunStats();
    });
  })();

  // ---------- bin computation per zoom ----------

  function buildBins() {
    var w = state.dailyWalk;
    var r = state.dailyRun;
    var today = new Date(); today.setHours(12,0,0,0);
    var bins = [];

    function pushBin(opts) {
      bins.push({
        label: opts.label,
        walkMiles: opts.walk,
        runMiles:  opts.run,
        miles:     opts.walk + opts.run,
        isCurrent: !!opts.isCurrent,
        tooltip:   opts.tooltip,
        drillTo:   opts.drillTo
      });
    }

    if (state.zoom === 'week') {
      var sun = startOfWeek(state.cursor);
      for (var i = 0; i < 7; i++) {
        var dt = addDays(sun, i);
        var k = fmtDate(dt);
        pushBin({
          label: DOW_TINY[i],
          walk:  w[k] || 0,
          run:   r[k] || 0,
          isCurrent: sameDate(dt, today),
          tooltip: dt.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })
        });
      }
    } else if (state.zoom === 'month') {
      var first = startOfMonth(state.cursor);
      var last  = new Date(first.getFullYear(), first.getMonth() + 1, 0, 12);
      var sunCursor = startOfWeek(first);
      var weekIdx = 1;
      while (sunCursor <= last) {
        var sumW = 0, sumR = 0;
        for (var i = 0; i < 7; i++) {
          var dt = addDays(sunCursor, i);
          if (sameMonth(dt, first)) {
            var k = fmtDate(dt);
            sumW += w[k] || 0;
            sumR += r[k] || 0;
          }
        }
        var satCursor = addDays(sunCursor, 6);
        pushBin({
          label: 'W' + weekIdx,
          walk: sumW, run: sumR,
          isCurrent: today >= sunCursor && today <= satCursor,
          tooltip: 'Week of ' + sunCursor.toLocaleDateString('en-US', { month:'short', day:'numeric' }),
          drillTo: { zoom: 'week', cursor: new Date(sunCursor) }
        });
        sunCursor = addDays(sunCursor, 7);
        weekIdx++;
      }
    } else if (state.zoom === 'year') {
      for (var m = 0; m < 12; m++) {
        var monthDate = new Date(state.cursor.getFullYear(), m, 1, 12);
        var ym = monthDate.getFullYear() + '-' + pad2(m + 1);
        var sumW = 0, sumR = 0;
        Object.keys(w).forEach(function(k) { if (k.indexOf(ym) === 0) sumW += w[k]; });
        Object.keys(r).forEach(function(k) { if (k.indexOf(ym) === 0) sumR += r[k]; });
        pushBin({
          label: MONTHS_SHORT[m],
          walk: sumW, run: sumR,
          isCurrent: sameMonth(monthDate, today),
          tooltip: monthDate.toLocaleDateString('en-US', { month:'long', year:'numeric' }),
          drillTo: { zoom: 'month', cursor: monthDate }
        });
      }
    } else if (state.zoom === 'all') {
      if (!state.firstEntryDate) return [];
      var firstYear = parseInt(state.firstEntryDate.substring(0, 4), 10);
      var thisYear = today.getFullYear();
      for (var yr = firstYear; yr <= thisYear; yr++) {
        var yrStr = String(yr);
        var sumW = 0, sumR = 0;
        Object.keys(w).forEach(function(k) { if (k.indexOf(yrStr + '-') === 0) sumW += w[k]; });
        Object.keys(r).forEach(function(k) { if (k.indexOf(yrStr + '-') === 0) sumR += r[k]; });
        pushBin({
          label: yrStr,
          walk: sumW, run: sumR,
          isCurrent: yr === today.getFullYear(),
          tooltip: yrStr + ' total',
          drillTo: { zoom: 'year', cursor: new Date(yr, 0, 1, 12) }
        });
      }
    }
    return bins;
  }

  // ---------- range label ----------

  function rangeLabel() {
    if (state.zoom === 'week') {
      var sun = startOfWeek(state.cursor);
      var sat = addDays(sun, 6);
      var sameMo = sun.getMonth() === sat.getMonth();
      var startStr = sun.toLocaleDateString('en-US', { month:'short', day:'numeric' });
      var endStr   = sameMo
        ? String(sat.getDate())
        : sat.toLocaleDateString('en-US', { month:'short', day:'numeric' });
      return startStr + ' – ' + endStr + ', ' + sun.getFullYear();
    }
    if (state.zoom === 'month') {
      return state.cursor.toLocaleDateString('en-US', { month:'long', year:'numeric' });
    }
    if (state.zoom === 'year') {
      return String(state.cursor.getFullYear());
    }
    return 'All time';
  }

  // ---------- nav: prev/next ----------

  // Pure: the cursor one period away, without mutating state.
  function stepCursor(c, dir) {
    if (state.zoom === 'week')  return addDays(c,   dir * 7);
    if (state.zoom === 'month') return addMonths(c, dir);
    if (state.zoom === 'year')  return addYears(c,  dir);
    return c; // 'all' has no nav
  }
  function shiftCursor(direction) { state.cursor = stepCursor(state.cursor, direction); }

  // Run a cursor-reading function as if state.cursor were `c` (used to build
  // the neighbouring carousel panes without disturbing real state).
  function withCursor(c, fn) {
    var save = state.cursor;
    state.cursor = c;
    try { return fn(); } finally { state.cursor = save; }
  }

  function navDisabled() {
    if (state.zoom === 'all') return { prev: true, next: true };
    var today = new Date(); today.setHours(12,0,0,0);
    var prev = false, next = false;
    if (state.firstEntryDate) {
      var first = parseDate(state.firstEntryDate);
      if (state.zoom === 'week'  && addDays(startOfWeek(state.cursor),   -1) < startOfWeek(first))   prev = true;
      if (state.zoom === 'month' && addMonths(startOfMonth(state.cursor), -1) < startOfMonth(first))  prev = true;
      if (state.zoom === 'year'  && state.cursor.getFullYear() - 1 < first.getFullYear())              prev = true;
    }
    if (state.zoom === 'week'  && addDays(startOfWeek(state.cursor),    7) > startOfWeek(today))   next = true;
    if (state.zoom === 'month' && addMonths(startOfMonth(state.cursor), 1) > startOfMonth(today))  next = true;
    if (state.zoom === 'year'  && state.cursor.getFullYear() + 1 > today.getFullYear())             next = true;
    return { prev: prev, next: next };
  }

  // ---------- render ----------

  var centerBins = [];

  function barsHTML(bins, max) {
    return bins.map(function(b, i) {
      var pct = (b.miles / max) * 100;
      var cls = 'chart-bar' + (b.drillTo ? ' is-drillable' : '') + (b.isCurrent ? ' is-current' : '');
      var walkPct = b.miles > 0 ? (b.walkMiles / b.miles) * 100 : 0;
      var runPct  = b.miles > 0 ? (b.runMiles  / b.miles) * 100 : 0;
      var val = b.miles > 0 ? '<div class="chart-bar-value">' + b.miles.toFixed(1) + '</div>' : '';
      var segs = '';
      // Stack: run on top (rendered first), walk on bottom (flex puts last at bottom)
      if (b.runMiles  > 0) segs += '<div class="chart-bar-seg chart-bar-seg-run"  style="height:' + runPct  + '%"></div>';
      if (b.walkMiles > 0) segs += '<div class="chart-bar-seg chart-bar-seg-walk" style="height:' + walkPct + '%"></div>';
      return '<div class="' + cls + '" data-idx="' + i + '" style="height:' + pct + '%" title="' + b.tooltip + ': ' + b.miles.toFixed(1) + ' mi">' + val + segs + '</div>';
    }).join('');
  }
  function labelsHTML(bins) {
    return bins.map(function(b) {
      return '<div class="chart-label' + (b.isCurrent ? ' is-current' : '') + '">' + (b.label || '') + '</div>';
    }).join('');
  }

  // Round a number up to a clean 1/2/2.5/5/10 × 10ⁿ value.
  function niceNum(x) {
    if (x <= 0) return 1;
    var p = Math.pow(10, Math.floor(Math.log(x) / Math.LN10));
    var n = x / p;
    var m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return m * p;
  }
  // A clean scale (~4 steps) that comfortably contains `max`.
  // Scale is tuned to THIS period's own data, with only a little headroom so
  // the bars fill the chart. Reference lines land on clean round values that
  // sit within the data range.
  function scaleFor(max) {
    return {
      max: max,
      barMax: max / 0.94,       // tallest bar ≈ 94% tall — minimal headroom
      step: niceNum(max / 3)    // ~3 reference lines, tuned to this period
    };
  }
  function gridHTML(sc) {
    var html = '';
    // Faint unlabeled minor lines at the half-steps.
    for (var mh = sc.step / 2; mh <= sc.max + 1e-6; mh += sc.step) {
      html += '<div class="chart-gridline chart-gridline-minor" style="bottom:' + (mh / sc.barMax * 100) + '%"></div>';
    }
    // Labeled major lines.
    for (var v = sc.step; v <= sc.max + 1e-6; v += sc.step) {
      var lbl = sc.step < 1 ? v.toFixed(1) : String(Math.round(v));
      html += '<div class="chart-gridline" style="bottom:' + (v / sc.barMax * 100) + '%"><span>' + lbl + '</span></div>';
    }
    return html;
  }

  // Largest bin value across the WHOLE dataset at the current zoom, so the
  // scale is the same for every period and they can be compared by eye.
  function periodStart(c) {
    if (state.zoom === 'week')  return startOfWeek(c);
    if (state.zoom === 'month') return startOfMonth(c);
    if (state.zoom === 'year')  return startOfYear(c);
    return c;
  }
  function computeZoomMax() {
    var max = 0;
    function scan(bins) { bins.forEach(function(b) { if (b.miles > max) max = b.miles; }); }
    if (state.zoom === 'all') {
      scan(withCursor(state.cursor, function() { return buildBins(); }));
    } else {
      var today = new Date(); today.setHours(12, 0, 0, 0);
      var first = state.firstEntryDate ? parseDate(state.firstEntryDate) : state.cursor;
      var c = periodStart(first), endC = periodStart(today), guard = 0;
      while (c <= endC && guard++ < 1000) {
        scan(withCursor(new Date(c), function() { return buildBins(); }));
        c = stepCursor(c, 1);
      }
    }
    return max > 0 ? max : 1;
  }

  // Fill one carousel pane (prev | center | next) for the period at `cursor`.
  function fillPane(which, cursor, sc) {
    var data = withCursor(cursor, function() {
      return { bins: buildBins(), label: rangeLabel(), days: computeDaysInRange() };
    });
    var bins = data.bins;
    var totalMiles = bins.reduce(function(s, b) { return s + b.miles; }, 0);
    var pane = document.querySelector('.chart-pane[data-pane="' + which + '"]');
    pane.querySelector('.chart-grid').innerHTML   = gridHTML(sc);
    pane.querySelector('.chart-bars').innerHTML   = barsHTML(bins, sc.barMax);
    pane.querySelector('.chart-labels').innerHTML = labelsHTML(bins);
    return { bins: bins, label: data.label, days: data.days, miles: totalMiles };
  }

  // Snap the track back to the centre pane with no animation.
  function resetTrack() {
    var trk = document.getElementById('chart-track');
    if (!trk) return;
    trk.style.transition = 'none';
    trk.style.transform  = 'translateX(-33.3333%)';
    void trk.offsetWidth; // commit before any later animation
  }

  // Tween a number element from its previous value to `to`.
  function animateNumber(el, to, decimals) {
    var from = parseFloat(el.getAttribute('data-val'));
    if (isNaN(from)) from = 0;
    el.setAttribute('data-val', to);
    if (el._raf) cancelAnimationFrame(el._raf);
    if (from === to) { el.textContent = to.toFixed(decimals); return; }
    var start = null, dur = 450;
    function frame(ts) {
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      var e = 1 - Math.pow(1 - p, 3); // easeOutCubic
      el.textContent = (from + (to - from) * e).toFixed(decimals);
      if (p < 1) el._raf = requestAnimationFrame(frame);
      else { el.textContent = to.toFixed(decimals); el._raf = null; }
    }
    el._raf = requestAnimationFrame(frame);
  }

  function render() {
    var sc = scaleFor(computeZoomMax());
    fillPane('prev',  stepCursor(state.cursor, -1), sc);
    var c = fillPane('center', state.cursor, sc);
    fillPane('next',  stepCursor(state.cursor,  1), sc);
    centerBins = c.bins;

    animateNumber(document.getElementById('summary-miles'), c.miles, 1);
    animateNumber(document.getElementById('summary-days'),  c.days,  0);
    document.getElementById('range-label').textContent = c.label;

    var nav = navDisabled();
    document.getElementById('range-prev').disabled = nav.prev;
    document.getElementById('range-next').disabled = nav.next;

    document.querySelectorAll('.zoom-btn').forEach(function(b) {
      var on = b.getAttribute('data-zoom') === state.zoom;
      b.classList.toggle('is-active', on);
      // Drive the visual inline too — iOS Safari sometimes fails to repaint a
      // class-only change here, leaving the previous button looking selected.
      b.style.background = on ? '#E89A1F' : 'transparent';
      b.style.color      = on ? '#1a1a1a' : '';
      b.style.opacity    = on ? '1' : '0.55';
    });
    var zb = document.querySelector('.zoom-buttons');
    if (zb) { zb.style.display = 'none'; void zb.offsetHeight; zb.style.display = ''; }

    resetTrack();
  }

  function computeDaysInRange() {
    var count = 0;
    if (state.zoom === 'week') {
      var sun = startOfWeek(state.cursor);
      for (var i = 0; i < 7; i++) if (dayTotal(fmtDate(addDays(sun, i))) > 0) count++;
    } else if (state.zoom === 'month') {
      var first = startOfMonth(state.cursor);
      var n = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
      for (var dy = 1; dy <= n; dy++) {
        var dt = new Date(first.getFullYear(), first.getMonth(), dy, 12);
        if (dayTotal(fmtDate(dt)) > 0) count++;
      }
    } else if (state.zoom === 'year') {
      var yr = state.cursor.getFullYear();
      var seen = {};
      Object.keys(state.dailyWalk).forEach(function(k) { if (k.indexOf(yr + '-') === 0) seen[k] = true; });
      Object.keys(state.dailyRun).forEach(function(k) { if (k.indexOf(yr + '-') === 0) seen[k] = true; });
      count = Object.keys(seen).length;
    } else if (state.zoom === 'all') {
      var seen2 = {};
      Object.keys(state.dailyWalk).forEach(function(k) { seen2[k] = true; });
      Object.keys(state.dailyRun).forEach(function(k) { seen2[k] = true; });
      count = Object.keys(seen2).length;
    }
    return count;
  }

  // ---------- wire UI ----------

  var dragged = false;
  var slideStep = null; // set by the carousel: animated version of step()

  // Step one period, honoring the same bounds the prev/next arrows use.
  // Falls back to an instant change if the carousel isn't wired yet.
  function step(dir) {
    var nav = navDisabled();
    if (dir < 0 && nav.prev) return;
    if (dir > 0 && nav.next) return;
    shiftCursor(dir);
    render();
  }

  document.getElementById('range-prev').addEventListener('click', function() { (slideStep || step)(-1); });
  document.getElementById('range-next').addEventListener('click', function() { (slideStep || step)( 1); });

  // ---- swipeable carousel: chart follows the finger, snaps on release ----
  (function() {
    var viewport = document.getElementById('chart-viewport');
    var track    = document.getElementById('chart-track');
    if (!viewport || !track) return;

    var CENTER = -100 / 3;   // % transform that shows the centre pane
    var down = false, decided = false, horizontal = false, settling = false;
    var startX = 0, startY = 0, paneW = 1, canPrev = false, canNext = false;

    function setLive(px) {
      track.style.transition = 'none';
      track.style.transform  = 'translateX(calc(' + CENTER + '% + ' + px + 'px))';
    }
    function animateTo(pct, after) {
      settling = true;
      track.style.transition = 'transform 0.56s cubic-bezier(0.2,0.8,0.2,1)';
      track.style.transform  = 'translateX(' + pct + '%)';
      var done = false;
      function fin() {
        if (done) return;
        done = true;
        track.removeEventListener('transitionend', fin);
        settling = false;
        if (after) after();
      }
      track.addEventListener('transitionend', fin);
      setTimeout(fin, 680); // safety net if transitionend is missed
    }

    function begin(e) {
      if (settling) return;
      down = true; decided = false; horizontal = false; dragged = false;
      startX = e.clientX; startY = e.clientY;
      paneW = viewport.getBoundingClientRect().width || 1;
      var nav = navDisabled();
      canPrev = !nav.prev;
      canNext = !nav.next;
      // NOTE: don't capture the pointer here — capturing on a plain tap steals
      // the follow-up click so bar tap-to-drill never fires. Capture only once
      // a real horizontal drag is confirmed (below).
    }
    function move(e) {
      if (!down) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (!decided) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        decided = true;
        horizontal = Math.abs(dx) > Math.abs(dy);
        if (!horizontal) { down = false; return; } // vertical → let the page scroll
        try { viewport.setPointerCapture(e.pointerId); } catch (_) {} // drag confirmed
      }
      dragged = true;
      e.preventDefault();
      if ((dx > 0 && !canPrev) || (dx < 0 && !canNext)) dx *= 0.32; // resist at edges
      setLive(dx);
    }
    function end(e) {
      if (!down) return;
      down = false;
      if (!horizontal) return;
      var dx = e.clientX - startX;
      var threshold = Math.max(45, paneW * 0.22);
      if (dx <= -threshold && canNext) {
        animateTo(-200 / 3, function() { state.cursor = stepCursor(state.cursor,  1); render(); });
      } else if (dx >= threshold && canPrev) {
        animateTo(0,         function() { state.cursor = stepCursor(state.cursor, -1); render(); });
      } else {
        animateTo(CENTER); // not far enough — spring back
      }
    }

    viewport.addEventListener('pointerdown', function(e) {
      if (e.button && e.button !== 0) return;
      begin(e);
    });
    viewport.addEventListener('pointermove', move);
    viewport.addEventListener('pointerup', end);
    viewport.addEventListener('pointercancel', function() {
      if (down) { down = false; if (horizontal) animateTo(CENTER); }
    });

    // Arrows reuse the same slide+commit animation as a swipe.
    slideStep = function(dir) {
      if (settling) return;
      var nav = navDisabled();
      if ((dir < 0 && nav.prev) || (dir > 0 && nav.next)) return;
      if (dir > 0) animateTo(-200 / 3, function() { state.cursor = stepCursor(state.cursor,  1); render(); });
      else         animateTo(0,        function() { state.cursor = stepCursor(state.cursor, -1); render(); });
    };
  })();

  // Drill-down: tap a bar in the centre pane (a swipe won't trigger this).
  var suppressBarClick = false;
  document.getElementById('chart-track').addEventListener('click', function(e) {
    if (dragged) { dragged = false; return; }
    if (suppressBarClick) { suppressBarClick = false; return; } // came from a long-press
    var bar = e.target.closest('.chart-pane[data-pane="center"] .chart-bar');
    if (!bar) return;
    var bin = centerBins[parseInt(bar.getAttribute('data-idx'), 10)];
    if (!bin || !bin.drillTo) return;
    state.zoom = bin.drillTo.zoom;
    state.cursor = bin.drillTo.cursor;
    render();
  });

  // Long-press a bar to preview its stats (a quick tap still drills in).
  (function() {
    var card = document.querySelector('.chart-card');
    var pop  = document.getElementById('bar-pop');
    if (!card || !pop) return;
    var timer = null, sx = 0, sy = 0;

    function hide() { pop.classList.remove('show'); }
    function showFor(bar) {
      var bin = centerBins[parseInt(bar.getAttribute('data-idx'), 10)];
      if (!bin) return;
      var html =
        '<div class="bp-title">' + bin.tooltip + '</div>' +
        '<div class="bp-row"><span><span class="bp-dot" style="background:#8FCFC2"></span>Walk</span><b>' + bin.walkMiles.toFixed(1) + '</b></div>';
      if (bin.runMiles > 0) {
        html += '<div class="bp-row"><span><span class="bp-dot" style="background:#E7D7A4"></span>Run</span><b>' + bin.runMiles.toFixed(1) + '</b></div>';
      }
      html += '<div class="bp-row bp-total"><span>Total</span><b>' + bin.miles.toFixed(1) + ' mi</b></div>';
      pop.innerHTML = html;
      var br = bar.getBoundingClientRect(), cr = card.getBoundingClientRect();
      var x = br.left - cr.left + br.width / 2;
      x = Math.max(72, Math.min(cr.width - 72, x)); // keep the bubble on the card
      pop.style.left = x + 'px';
      pop.style.top  = (br.top - cr.top - 8) + 'px';
      pop.classList.add('show');
      suppressBarClick = true; // the release that ends the hold must not drill
    }
    function cancelTimer() { if (timer) { clearTimeout(timer); timer = null; } }

    card.addEventListener('pointerdown', function(e) {
      suppressBarClick = false; // fresh gesture — never inherit a stuck flag
      var bar = e.target.closest('.chart-pane[data-pane="center"] .chart-bar');
      if (!bar) return;
      sx = e.clientX; sy = e.clientY;
      cancelTimer();
      timer = setTimeout(function() { timer = null; showFor(bar); }, 420);
    });
    card.addEventListener('pointermove', function(e) {
      if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) {
        cancelTimer();                                  // a swipe, not a hold
        if (pop.classList.contains('show')) hide();
      }
    });
    function release() { cancelTimer(); hide(); }
    card.addEventListener('pointerup', release);
    card.addEventListener('pointercancel', release);
    card.addEventListener('pointerleave', release);
  })();

  document.querySelectorAll('.zoom-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      btn.blur(); // drop focus so the tapped button doesn't stay highlighted on touch
      var z = btn.getAttribute('data-zoom');
      state.zoom = z;
      // Snap cursor to the START of the new period (so the label feels right)
      var today = new Date(); today.setHours(12,0,0,0);
      if (z === 'week')  state.cursor = startOfWeek(today);
      if (z === 'month') state.cursor = startOfMonth(today);
      if (z === 'year')  state.cursor = startOfYear(today);
      if (z === 'all')   state.cursor = today;
      render();
    });
  });

  MilesTracker.onReady = function() { loadData(); };
  MilesTracker.init();

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mileage — Activity</title>

  <meta name="description" content="The full picture of one walk or run.">
  <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mileage">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#252525">

  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://p.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/ymz2nvi.css">

  <script src="miles-tracker.js"></script>
  <script src="nav.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scrollbar-width: none; -ms-overflow-style: none; }
    body::-webkit-scrollbar { display: none; }
    body {
      background: #252525; color: #f5f5f5;
      font-family: "omnes", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    /* full-screen detail (no stripes, no card) — slides in from the right
       like an iOS push; native back / swipe returns to the list. */
    body { overflow-x: hidden; }
    @keyframes aSlideIn {
      from { transform: translateX(100%); }
      to   { transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      @keyframes aSlideIn { from { transform: none; } to { transform: none; } }
    }

    .a-back {
      position: fixed; top: 18px; left: 18px; z-index: 50;
      width: 42px; height: 42px; padding: 0;
      border: none; border-radius: 50%;
      background: rgba(0, 0, 0, 0.45); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    }
    .a-back::before {
      content: ''; width: 11px; height: 11px;
      border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff;
      transform: translateX(2px) rotate(45deg); border-radius: 1px;
    }
    .a-back:active { transform: scale(0.93); }

    .a-wrap {
      max-width: 520px; margin: 0 auto;
      min-height: 100vh;
      padding: 4.6rem 1.5rem 3rem;
      background: inherit;
      transform: translateX(100%);
      will-change: transform;
    }
    /* slide-in is triggered AFTER the loader hides so it's actually seen */
    .a-wrap.a-ready {
      animation: aSlideIn 0.32s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    /* NRC-style: date·time, big title, rule, hero, stat grid */
    .a-when {
      font-size: 0.92rem; font-weight: 700; opacity: 0.5;
      letter-spacing: 0.01em;
    }
    .a-name {
      font-size: 2rem; font-weight: 900; letter-spacing: -0.02em;
      margin: 0.35rem 0 1rem; line-height: 1.04;
    }
    .a-rule {
      height: 1px; border: none; margin: 0 0 1.6rem;
      background: rgba(255, 255, 255, 0.12);
    }
    .a-hero { margin-bottom: 1.8rem; }
    .a-hero b {
      display: block;
      font-size: clamp(3.4rem, 18vw, 4.6rem); font-weight: 900;
      letter-spacing: -0.02em; line-height: 0.95;
    }
    .a-hero span {
      display: block; margin-top: 0.5rem;
      font-size: 0.9rem; font-weight: 700; opacity: 0.5;
    }
    .a-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      row-gap: 1.7rem; column-gap: 1rem;
    }
    .a-cell b {
      display: block; font-size: 1.55rem; font-weight: 900;
      letter-spacing: -0.01em; line-height: 1;
    }
    .a-cell span {
      display: block; margin-top: 0.35rem;
      font-size: 0.82rem; font-weight: 600; opacity: 0.5; line-height: 1.15;
    }
    .a-cell a { color: #8FCFC2; text-decoration: none; }
    .a-notes {
      margin-top: 1.8rem; padding-top: 1.2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.95rem; line-height: 1.55; opacity: 0.82;
      white-space: pre-wrap; word-break: break-word;
    }
    .a-shoe {
      margin-top: 1.8rem; padding-top: 1.4rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    .a-shoe .snm { font-size: 1.4rem; font-weight: 900; letter-spacing: -0.01em; }
    .a-shoe .smd { font-size: 0.95rem; font-weight: 600; opacity: 0.55; margin-top: 0.2rem; }
    .a-shoe img {
      display: block; width: 100%; max-width: 360px;
      margin: 1.1rem auto 0; aspect-ratio: 4 / 3;
      object-fit: contain; border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
    }

    .a-map {
      position: relative; height: 340px;
      margin: 1.6rem 0; /* a little L/R padding (sits inside the gutter) */
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px; overflow: hidden;
    }
    .a-map-canvas { position: absolute; inset: 0; }
    .a-map-full {
      position: absolute; top: 10px; right: 10px; z-index: 400;
      width: 36px; height: 36px; padding: 0; border: none; border-radius: 8px;
      background: rgba(0, 0, 0, 0.55); color: #fff;
      font-size: 1rem; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }
    #afull {
      display: none; position: fixed; inset: 0; z-index: 10001; background: #ECE0BE;
    }
    #afull.show { display: block; }
    #afull-map { position: absolute; inset: 0; }
    .afull-x {
      position: absolute; top: 16px; right: 16px; z-index: 2;
      width: 42px; height: 42px; padding: 0; border: none; border-radius: 50%;
      background: rgba(0, 0, 0, 0.6); cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }
    .afull-x::before, .afull-x::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 18px; height: 2px; border-radius: 1px; background: #fff;
    }
    .afull-x::before { transform: translate(-50%, -50%) rotate(45deg); }
    .afull-x::after  { transform: translate(-50%, -50%) rotate(-45deg); }

    .a-msg { text-align: center; opacity: 0.5; padding: 4rem 1rem; font-size: 0.95rem; }

    #mt-loader {
      position: fixed; inset: 0; background: #252525;
      display: flex; align-items: center; justify-content: center;
      z-index: 10000; transition: opacity 0.5s ease;
    }
    #mt-loader.mt-loader-hide { opacity: 0; pointer-events: none; }
    .mt-loader-bar {
      width: 240px; height: 12px; border-radius: 6px;
      background: rgba(255, 255, 255, 0.08); overflow: hidden;
    }
    .mt-loader-fill {
      height: 100%; width: 0%;
      background: linear-gradient(to right,
        #016074 0%, #016074 16.67%, #94D3BE 16.67%, #94D3BE 33.33%,
        #E7D7A4 33.33%, #E7D7A4 50%, #EB9A00 50%, #EB9A00 66.67%,
        #CA6902 66.67%, #CA6902 83.33%, #B02113 83.33%, #B02113 100%);
      background-size: 240px 100%; transition: width 0.3s ease-out;
    }
    html[data-theme="light"] #mt-loader { background: #f1ebdd; }
    html[data-theme="light"] .mt-loader-bar { background: rgba(0, 0, 0, 0.10); }
    html[data-theme="light"] .a-rule { background: rgba(0, 0, 0, 0.12); }
    html[data-theme="light"] .a-notes,
    html[data-theme="light"] .a-shoe { border-top-color: rgba(0, 0, 0, 0.12); }
    html[data-theme="light"] .a-cell a { color: #016074; }
    html[data-theme="light"] .a-map,
    html[data-theme="light"] .a-shoe img { background: rgba(0, 0, 0, 0.06); }
  </style>
</head>
<body>

<div id="mt-loader"><div class="mt-loader-bar"><div class="mt-loader-fill"></div></div></div>

<button class="a-back" type="button" aria-label="Back" onclick="aBack()"></button>

<div class="a-wrap"><div id="a-content"></div></div>

<div id="afull">
  <div id="afull-map"></div>
  <button class="afull-x" type="button" aria-label="Close map" onclick="aCloseFull()"></button>
</div>

<script>
  function aEsc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
    });
  }
  function aQ(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  window.aBack = function() {
    if (document.referrer && /history\.html/.test(document.referrer)) history.back();
    else if (history.length > 1) history.back();
    else location.href = 'history.html';
  };

  var A_MONTHS = ['January','February','March','April','May','June','July',
    'August','September','October','November','December'];
  function aDateParts(d) {
    var m = String(d || '').match(/(\d{4})-(\d{2})-(\d{2})/);
    return m ? { y:+m[1], mo:+m[2]-1, da:+m[3] } : null;
  }
  function aShort(d) {
    var p = aDateParts(d); if (!p) return String(d || '');
    return (p.mo + 1) + '/' + p.da + '/' + String(p.y).slice(-2);
  }
  function aLongDate(d) {
    var p = aDateParts(d); if (!p) return String(d || '');
    var dt = new Date(p.y, p.mo, p.da, 12);
    return dt.toLocaleDateString('en-US',
      { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  }
  function aWeekday(d) {
    var p = aDateParts(d); if (!p) return '';
    return new Date(p.y, p.mo, p.da, 12).toLocaleDateString('en-US', { weekday:'long' });
  }
  function aTitle(r) {
    var t = String(r.start_time || '').match(/^(\d{1,2}):/);
    var part = '';
    if (t) {
      var h = +t[1];
      part = h < 12 ? 'Morning' : (h < 17 ? 'Afternoon' : (h < 21 ? 'Evening' : 'Night'));
    }
    return [aWeekday(r.date), part, (r.type === 'Run' ? 'Run' : 'Walk')]
      .filter(Boolean).join(' ');
  }
  function a12(t) {
    var m = String(t || '').match(/^(\d{1,2}):(\d{2})/);
    if (!m) return '';
    var h = +m[1], ap = h < 12 ? 'AM' : 'PM', h12 = (h % 12) || 12;
    return h12 + ':' + m[2] + ' ' + ap;
  }
  function aKey(r) {
    if (r.activity_id) return String(r.activity_id);
    return [r.date, r.miles, r.start_time || ''].join('|');
  }
  function aRow(k, v) {
    if (v === '' || v == null) return '';
    return '<div class="a-row"><span class="k">' + k +
           '</span><span class="v">' + v + '</span></div>';
  }

  // ---- brand-styled Google map (shared with the run popup) ----
  var GMAPS_KEY = 'AIzaSyBKFBwCfrXN_FuC7clWzqc8G_p73kpj8oE';
  var A_STYLE = [
    { elementType:'geometry', stylers:[{color:'#ECE0BE'}] },
    { elementType:'labels.text.fill', stylers:[{color:'#3A2E12'}] },
    { elementType:'labels.text.stroke', stylers:[{color:'#F4ECD3'}] },
    { elementType:'labels.icon', stylers:[{visibility:'off'}] },
    { featureType:'administrative', elementType:'geometry.stroke', stylers:[{color:'#B98A3C'}] },
    { featureType:'landscape.natural', elementType:'geometry', stylers:[{color:'#DCD3A6'}] },
    { featureType:'poi', stylers:[{visibility:'off'}] },
    { featureType:'poi.park', elementType:'geometry', stylers:[{color:'#BFD8B8'}] },
    { featureType:'road', elementType:'geometry', stylers:[{color:'#E8C77A'}] },
    { featureType:'road.arterial', elementType:'geometry', stylers:[{color:'#E3B45A'}] },
    { featureType:'road.highway', elementType:'geometry', stylers:[{color:'#E89A1F'}] },
    { featureType:'road', elementType:'labels', stylers:[{visibility:'off'}] },
    { featureType:'transit', stylers:[{visibility:'off'}] },
    { featureType:'water', elementType:'geometry', stylers:[{color:'#8FCFC2'}] }
  ];
  var _gmP = null;
  function loadGMaps() {
    if (_gmP) return _gmP;
    if (!GMAPS_KEY) return Promise.reject('no key');
    _gmP = new Promise(function(res, rej) {
      var s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' +
              encodeURIComponent(GMAPS_KEY) + '&v=quarterly';
      s.async = true; s.defer = true;
      s.onload = function() {
        (window.google && google.maps) ? res(google.maps) : rej('not ready');
      };
      s.onerror = function() { rej('failed'); };
      document.head.appendChild(s);
    });
    return _gmP;
  }
  var aPts = null;
  function aDrawMap(el, pts, interactive) {
    return loadGMaps().then(function(gm) {
      var m = new gm.Map(el, {
        disableDefaultUI: true, clickableIcons: false, keyboardShortcuts: false,
        gestureHandling: interactive ? 'greedy' : 'none',
        disableDoubleClickZoom: !interactive,
        backgroundColor: '#ECE0BE', styles: A_STYLE
      });
      var path = pts.map(function(p) { return { lat:p[0], lng:p[1] }; });
      new gm.Polyline({ path:path, map:m,
        strokeColor:'#B02113', strokeOpacity:0.95, strokeWeight:4 });
      var b = new gm.LatLngBounds();
      path.forEach(function(p) { b.extend(p); });
      m.fitBounds(b, 24);
      return m;
    });
  }
  window.aOpenFull = function() {
    if (!aPts) return;
    var ov = document.getElementById('afull'), el = document.getElementById('afull-map');
    el.innerHTML = ''; ov.classList.add('show');
    aDrawMap(el, aPts, true).catch(function() { ov.classList.remove('show'); });
  };
  window.aCloseFull = function() {
    document.getElementById('afull').classList.remove('show');
  };

  function aShoeIndex(shoes) {
    var idx = {};
    (shoes || []).forEach(function(s) {
      var keys = [s.display, s.name].concat(s.matchKeys || []);
      keys.forEach(function(k) {
        if (k) idx[String(k).trim().toLowerCase()] = s;
      });
    });
    return idx;
  }

  function aRender(r, shoeIdx) {
    var isRun = r.type === 'Run';
    var miles = (parseFloat(r.miles) || 0).toFixed(2);
    var aid = String(r.activity_id || '').trim();

    var shoeBlock = '';
    if (r.shoe) {
      var so = shoeIdx[String(r.shoe).trim().toLowerCase()];
      var snm = aEsc((so && (so.display || so.name)) || r.shoe);
      var smd = so ? aEsc(((so.brand || '') + ' ' + (so.model || '')).trim()) : '';
      var si = (so && so.photo)
        ? '<img src="' + aEsc(so.photo) + '" alt="" loading="lazy" ' +
          'onerror="this.style.display=\'none\'">' : '';
      shoeBlock = '<div class="a-shoe">' +
        '<div class="snm">' + snm + '</div>' +
        (smd && smd.toLowerCase() !== snm.toLowerCase()
          ? '<div class="smd">' + smd + '</div>' : '') +
        si + '</div>';
    }

    var num = function(v) { return (v != null && v !== '') ? v : ''; };
    function cell(label, val) {
      if (val === '' || val == null) return '';
      return '<div class="a-cell"><b>' + val + '</b><span>' + label + '</span></div>';
    }
    var when = aEsc(aShort(r.date)) + (a12(r.start_time) ? ' · ' + a12(r.start_time) : '');

    // Primary stats sit above the map; the rest below it.
    var primary =
      cell('Avg. Pace', r.pace ? aEsc(r.pace) : '') +
      cell('Time', r.duration ? aEsc(r.duration) : '') +
      cell('Calories', num(r.calories) !== '' ? Math.round(r.calories) : '') +
      cell('Elevation Gain', num(r.ascent) !== '' ? Math.round(r.ascent) + ' ft' : '') +
      cell('Avg. Heart Rate', num(r.avg_hr) !== '' ? Math.round(r.avg_hr) : '') +
      cell('Avg. Speed', num(r.avg_speed) !== '' ? (+r.avg_speed).toFixed(1) + ' mph' : '');
    var secondary =
      cell('Steps', num(r.steps) !== '' ? Math.round(r.steps).toLocaleString() : '') +
      cell('Elevation Loss', num(r.descent) !== '' ? Math.round(r.descent) + ' ft' : '') +
      cell('Start', a12(r.start_time)) +
      cell('End', a12(r.end_time)) +
      cell('Temp', (r.temp_f != null && r.temp_f !== '') ? Math.round(r.temp_f) + '°F' : '') +
      cell('Weather', r.weather ? aEsc(r.weather) : '');

    document.getElementById('a-content').innerHTML =
        '<div class="a-when">' + when + '</div>' +
        '<div class="a-name">' + aEsc(aTitle(r)) + '</div>' +
        '<hr class="a-rule">' +
        '<div class="a-hero"><b>' + miles + '</b><span>Miles</span></div>' +
        (primary ? '<div class="a-grid">' + primary + '</div>' : '') +
      (aid ? '<div class="a-map">' +
               '<div id="a-map" class="a-map-canvas"></div>' +
               '<button class="a-map-full" type="button" aria-label="Fullscreen map" ' +
               'onclick="aOpenFull()">⤢</button></div>' : '') +
        (secondary ? '<div class="a-grid">' + secondary + '</div>' : '') +
        (r.notes ? '<div class="a-notes">' + aEsc(r.notes) + '</div>' : '') +
        shoeBlock;

    if (aid) {
      fetch('routes/' + encodeURIComponent(aid) + '.json')
        .then(function(res) { if (!res.ok) throw 0; return res.json(); })
        .then(function(pts) {
          if (!pts || pts.length < 2) { aHideMap(); return; }
          aPts = pts;
          aDrawMap(document.getElementById('a-map'), pts).catch(aHideMap);
        })
        .catch(aHideMap);
    }
  }
  function aHideMap() {
    var mp = document.querySelector('.a-map');
    if (mp) mp.style.display = 'none';
  }

  function aHideLoader() {
    var l = document.getElementById('mt-loader');
    var f = document.querySelector('.mt-loader-fill');
    if (f) f.style.width = '100%';
    setTimeout(function() {
      if (l) l.classList.add('mt-loader-hide');
      // start the slide-in as the loader fades, so it's actually seen
      var w = document.querySelector('.a-wrap');
      if (w) requestAnimationFrame(function() {
        requestAnimationFrame(function() { w.classList.add('a-ready'); });
      });
    }, 300);
  }

  (function () {
    var want = aQ('id');
    var f = document.querySelector('.mt-loader-fill'), v = 0;
    var t = setInterval(function () {
      if (v >= 95) return;
      v += Math.max(0.4, (95 - v) * 0.05);
      if (f) f.style.width = v + '%';
    }, 100);

    var rowsIn = null, shoesIn = null, done = false;
    // SWR may fire cached then fresh. Render the moment we find the row;
    // only declare "not found" once (via the timeout) so a stale cache
    // miss doesn't lock in a false negative before fresh data lands.
    function tryRender(finalCall) {
      if (done) return;
      var rows = rowsIn || [], shoes = shoesIn || [];
      var match = null;
      for (var i = 0; i < rows.length; i++) {
        if (aKey(rows[i]) === want) { match = rows[i]; break; }
      }
      if (match) {
        done = true; clearInterval(t);
        aRender(match, aShoeIndex(shoes));
        aHideLoader();
      } else if (finalCall) {
        done = true; clearInterval(t);
        document.getElementById('a-content').innerHTML =
          '<div class="a-msg">That activity couldn’t be found.</div>';
        aHideLoader();
      }
    }
    setTimeout(function () { tryRender(true); }, 15000);

    MilesTracker.fetchAllEntries(function (rows) { rowsIn = rows || []; tryRender(false); });
    MilesTracker.fetchShoes(function (shoes) { shoesIn = shoes || []; tryRender(false); });
  })();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mock A — Goal-first</title>
<link rel="stylesheet" href="https://use.typekit.net/ymz2nvi.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f1ebdd;color:#171717;min-height:100vh;
    font-family:"omnes",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    padding-bottom:88px;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:-1;transform:translateY(60px);
    background:linear-gradient(159deg,transparent 0 76.6%,#016074 76.6% 78.8%,#94D3BE 78.8% 81.1%,
    #E7D7A4 81.1% 83.9%,#EB9A00 83.9% 86.6%,#CA6902 86.6% 89.3%,#B02113 89.3% 100%)}
  .wrap{max-width:560px;margin:0 auto;padding:2.4rem 1.4rem 1rem;text-align:center}
  .wm{font-weight:900;font-size:clamp(2.6rem,11vw,3.6rem);color:#C77A0C;letter-spacing:.01em}
  .sub{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;opacity:.45;font-weight:700;margin-top:.4rem}
  .ring{margin:2rem auto 1rem;width:230px;height:230px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct b{font-size:3.4rem;font-weight:900;line-height:1;letter-spacing:-.02em}
  .ring .pct span{font-size:.8rem;font-weight:800;opacity:.5;margin-top:.35rem;letter-spacing:.04em}
  .pace-tag{display:inline-flex;align-items:center;gap:.5rem;background:#0E7A8C;color:#fff;
    font-size:.8rem;font-weight:800;padding:.5rem 1rem;border-radius:999px;letter-spacing:.02em}
  .streak{margin-top:.9rem;font-size:.95rem;font-weight:800;opacity:.7}
  .week{display:flex;align-items:flex-end;justify-content:center;gap:7px;height:70px;margin:2rem 0 .4rem}
  .week i{width:30px;border-radius:5px 5px 0 0;background:#8FCFC2;display:block}
  .week i.now{background:#E89A1F}
  .week-l{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;opacity:.45;font-weight:700}
  .log{display:block;width:100%;max-width:420px;margin:2rem auto 0;padding:1.15rem;
    background:#E89A1F;color:#1a1a1a;border:none;border-radius:16px;font-family:inherit;
    font-size:1.05rem;font-weight:900;letter-spacing:.04em;box-shadow:0 5px 0 #b9760f;cursor:pointer}
  .mini{display:flex;justify-content:center;gap:2rem;margin-top:1.6rem;opacity:.55;
    font-size:.7rem;font-weight:700;letter-spacing:.06em}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:#fffdf7;display:flex;justify-content:center;
    gap:14px;padding:.5rem 0 1.4rem;box-shadow:0 -3px 12px rgba(0,0,0,.08);border-radius:14px 14px 0 0}
  .tab{width:64px;text-align:center;font-size:.55rem;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;opacity:.45;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tab.on{opacity:1;color:#C77A0C}
  .tab b{font-size:1.1rem}
  .flag{position:fixed;top:8px;left:8px;background:#171717;color:#fff;font-size:.6rem;
    font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:6px;font-family:system-ui}
</style>
</head>
<body>
<div class="bg"></div>
<div class="flag">MOCK A · GOAL-FIRST</div>
<div class="wrap">
  <div class="wm">MILEAGE</div>
  <div class="sub">2026</div>

  <div class="ring">
    <svg width="230" height="230">
      <circle cx="115" cy="115" r="100" stroke="rgba(0,0,0,.09)" stroke-width="18" fill="none"/>
      <circle cx="115" cy="115" r="100" stroke="#0E7A8C" stroke-width="18" fill="none"
        stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="307"/>
    </svg>
    <div class="pct"><b>51%</b><span>70 of 183 days</span></div>
  </div>

  <div class="pace-tag">▲ Ahead of pace · +2 days</div>
  <div class="streak">🔥 4-day streak · longest 9</div>

  <div class="week">
    <i style="height:38%"></i><i style="height:62%"></i><i style="height:30%"></i>
    <i style="height:88%"></i><i style="height:26%"></i><i class="now" style="height:50%"></i>
  </div>
  <div class="week-l">This week · 11.9 mi</div>

  <button class="log">+ LOG A WALK</button>

  <div class="mini"><span>295.1 MI</span><span>LONGEST 6.3</span><span>MONTHLY 68.0</span></div>
</div>

<div class="tabs">
  <div class="tab"><b>▣</b>Stats</div>
  <div class="tab"><b>📈</b>Trends</div>
  <div class="tab on"><b>＋</b>Entry</div>
  <div class="tab"><b>〜</b>Activity</div>
  <div class="tab"><b>👟</b>Shoes</div>
</div>
</body>
</html>

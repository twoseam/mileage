<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 Mileage</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mileage">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#252525">

  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://p.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/ymz2nvi.css">

  <script src="miles-tracker.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scrollbar-width: none; -ms-overflow-style: none; }
    body::-webkit-scrollbar { display: none; }
    body {
      background: #252525;
      color: #f5f5f5;
      font-family: "omnes", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .mt-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      transform: translateY(50px);
      background: linear-gradient(
        159deg,
        transparent 0%, transparent 76.6%,
        #016074 76.6%, #016074 78.8%,
        #94D3BE 78.8%, #94D3BE 81.1%,
        #E7D7A4 81.1%, #E7D7A4 83.9%,
        #EB9A00 83.9%, #EB9A00 86.6%,
        #CA6902 86.6%, #CA6902 89.3%,
        #B02113 89.3%, #B02113 100%
      );
    }

    .wordmark {
      max-width: 500px;
      margin: 3rem auto 3rem;
      padding: 0 2.5rem;
      text-align: center;
      font-family: "omnes", system-ui, sans-serif;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 0.01em;
    }
    .wordmark-year {
      font-size: clamp(3.5rem, 15vw, 6rem);
      color: #8FCFC2;
      margin-bottom: 0.1em;
    }
    .wordmark-title {
      font-size: clamp(3.5rem, 15vw, 6rem);
      color: #E89A1F;
    }

    #miles-tracker {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 2.5rem 2.5rem;
      border-radius: 8px;
    }

    #mt-stats, #mt-stats-2, #mt-stats-3 {
      display: flex;
      gap: 32px;
    }
    #mt-stats   { margin-bottom: 1.75rem; }
    #mt-stats-2 { margin-bottom: 1.75rem; }
    #mt-stats-3 { margin-bottom: 3.25rem; }

    .mt-stat { flex: 1; }

    .mt-stat-label {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.5;
      line-height: 1;
      margin-bottom: 4px;
    }

    .mt-stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    #mt-chart-section { margin-bottom: 3.25rem; }

    .mt-chart-label {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 8px;
    }

    #mt-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 80px;
      padding-top: 14px;
    }

    #mt-chart-labels {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .mt-bar {
      flex: 1;
      min-height: 1px;
      position: relative;
      transition: height 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .mt-bar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #8FCFC2;
      border-radius: 6px 6px 0 0;
    }

    .mt-bar-current::before { background: #E89A1F; }

    .mt-bar-value {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.6rem;
      color: #fff;
      margin-bottom: 2px;
      line-height: 1;
    }

    .mt-bar-label {
      flex: 1;
      text-align: center;
      font-size: 0.55rem;
      opacity: 0.5;
      line-height: 1;
    }

    /* ---------- FORM ---------- */

    .mt-field {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .mt-field label {
      display: block;
      font-size: 0.95rem;
      text-align: left;
      margin-bottom: 6px;
      color: inherit;
    }

    .mt-field label .mt-optional {
      font-size: 0.85rem;
      opacity: 0.5;
      margin-left: 6px;
    }

    .mt-field input[type="text"],
    .mt-field input[type="time"],
    .mt-field select,
    .mt-date-display {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid currentColor;
      border-radius: 0;
      padding: 8px 0;
      font-size: 1rem;
      font-family: inherit;
      color: inherit;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      text-align: left;
      line-height: 1.2;
    }

    .mt-field select {
      background-image:
        linear-gradient(45deg, transparent 50%, currentColor 50%),
        linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position:
        calc(100% - 16px) 50%,
        calc(100% - 11px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 24px;
      opacity: 0.95;
    }

    .mt-field-row {
      display: flex;
      gap: 16px;
    }
    .mt-field-row .mt-field { flex: 1; }

    .mt-date-display { pointer-events: none; }
    /* Real date input overlays the visible display — taps hit it directly,
       so the native picker opens with no JS shim. */
    .mt-date-real {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2.5rem;
      opacity: 0;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      border: none;
      padding: 0;
      background: transparent;
    }

    /* Walk / Run toggle */
    .mt-toggle {
      display: flex;
      gap: 8px;
    }
    .mt-toggle-btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .mt-toggle-btn.mt-active {
      background: #E89A1F;
      color: #1a1a1a;
      border-color: #E89A1F;
    }

    /* Notes: hidden behind a checkbox until toggled on */
    .mt-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      user-select: none;
      margin: 0;
    }
    .mt-checkbox input {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid currentColor;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      position: relative;
      opacity: 0.6;
      transition: opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      flex-shrink: 0;
      margin: 0;
    }
    .mt-checkbox input:checked {
      background: #E89A1F;
      border-color: #E89A1F;
      opacity: 1;
    }
    .mt-checkbox input:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 0px;
      width: 6px;
      height: 11px;
      border: solid #1a1a1a;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .mt-notes-wrap {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      transition: max-height 0.35s ease, opacity 0.35s ease, margin-top 0.35s ease;
    }
    .mt-notes-wrap.mt-expanded {
      max-height: 80px;
      opacity: 1;
      margin-top: 14px;
    }

    #mt-submit-btn {
      display: block;
      margin: 0 auto 6px;
      border: none;
      border-radius: 10px;
      padding: 16px 52px;
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      color: #1a1a1a;
      background: #E89A1F;
      box-shadow:
        0 5px 0 #8E5A0E,
        0 10px 18px rgba(0, 0, 0, 0.4);
      transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.2s ease;
    }
    #mt-submit-btn:hover { opacity: 0.95; }
    #mt-submit-btn:active {
      transform: translateY(5px);
      box-shadow:
        0 0 0 #8E5A0E,
        0 2px 6px rgba(0, 0, 0, 0.3);
    }
    #mt-submit-btn.mt-busy {
      opacity: 0.45;
      pointer-events: none;
    }

    .mt-submit-progress {
      width: 240px;
      height: 10px;
      border-radius: 5px;
      margin: 1rem auto 0;
      background: #111;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .mt-submit-progress.mt-show { opacity: 1; }
    .mt-submit-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(
        to right,
        #016074 0%,    #016074 16.67%,
        #94D3BE 16.67%, #94D3BE 33.33%,
        #E7D7A4 33.33%, #E7D7A4 50%,
        #EB9A00 50%,    #EB9A00 66.67%,
        #CA6902 66.67%, #CA6902 83.33%,
        #B02113 83.33%, #B02113 100%
      );
      background-size: 240px 100%;
      transition: width 0.3s ease-out;
    }

    #mt-result,
    #mt-error {
      display: none;
      margin: 1.25rem auto 0;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.02em;
      max-width: 280px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.35);
      background: #f5f0e6;
    }
    #mt-result:not(:empty),
    #mt-error:not(:empty) { display: block; }
    #mt-result { color: #016074; transition: opacity 0.4s ease; }
    #mt-error  { color: #B02113; transition: opacity 0.4s ease; }
    #mt-result.mt-fade-out,
    #mt-error.mt-fade-out { opacity: 0; }

    #mt-last-tracked {
      margin: 0.5rem 0 1rem;
      font-size: 0.85rem;
      text-align: center;
      opacity: 0.6;
      line-height: 1.5;
    }

    #mt-loader {
      position: fixed;
      inset: 0;
      background: #252525;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s ease;
    }
    #mt-loader.mt-loader-hide {
      opacity: 0;
      pointer-events: none;
    }
    .mt-loader-bar {
      width: 240px;
      height: 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .mt-loader-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(
        to right,
        #016074 0%,    #016074 16.67%,
        #94D3BE 16.67%, #94D3BE 33.33%,
        #E7D7A4 33.33%, #E7D7A4 50%,
        #EB9A00 50%,    #EB9A00 66.67%,
        #CA6902 66.67%, #CA6902 83.33%,
        #B02113 83.33%, #B02113 100%
      );
      background-size: 240px 100%;
      transition: width 0.3s ease-out;
    }

    .mt-footer {
      text-align: center;
      padding: 0 1.5rem 2rem;
    }
    .mt-footer a {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: inherit;
      text-decoration: none;
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }
    .mt-footer a:hover { opacity: 0.85; }

    .mt-build {
      margin-top: 0.6rem;
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      opacity: 0.18;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>

<div class="mt-bg"></div>

<div id="mt-loader">
  <div class="mt-loader-bar">
    <div class="mt-loader-fill"></div>
  </div>
</div>

<header class="wordmark">
  <div class="wordmark-year">2026</div>
  <div class="wordmark-title">MILEAGE</div>
</header>

<div id="miles-tracker">
  <div id="mt-stats">
    <div class="mt-stat">
      <div class="mt-stat-label">Total Miles</div>
      <div class="mt-stat-value" id="mt-miles-val">—</div>
    </div>
    <div class="mt-stat">
      <div class="mt-stat-label">Days walked</div>
      <div class="mt-stat-value" id="mt-days-val">—</div>
    </div>
    <div class="mt-stat">
      <div class="mt-stat-label">Percent</div>
      <div class="mt-stat-value" id="mt-percent-val">—</div>
    </div>
  </div>

  <div id="mt-stats-2">
    <div class="mt-stat">
      <div class="mt-stat-label">Weekly</div>
      <div class="mt-stat-value" id="mt-week-val">—</div>
    </div>
    <div class="mt-stat">
      <div class="mt-stat-label">Monthly</div>
      <div class="mt-stat-value" id="mt-month-val">—</div>
    </div>
    <div class="mt-stat">
      <div class="mt-stat-label">Longest Walk</div>
      <div class="mt-stat-value" id="mt-longest-walk-val">—</div>
    </div>
  </div>

  <div id="mt-stats-3">
    <div class="mt-stat">
      <div class="mt-stat-label">Current Streak</div>
      <div class="mt-stat-value" id="mt-streak-val">—</div>
    </div>
    <div class="mt-stat">
      <div class="mt-stat-label">Longest Streak</div>
      <div class="mt-stat-value" id="mt-longest-streak-val">—</div>
    </div>
    <div class="mt-stat"></div>
  </div>

  <div id="mt-chart-section">
    <div id="mt-chart"></div>
    <div id="mt-chart-labels"></div>
  </div>

  <div id="mt-form">

    <div class="mt-field">
      <label>Date</label>
      <div class="mt-date-display" id="mt-date-display"></div>
      <input type="date" class="mt-date-real" id="mt-date-input" />
    </div>

    <div class="mt-field">
      <label>Walk / Run</label>
      <div class="mt-toggle">
        <button type="button" class="mt-toggle-btn mt-active" data-type="Walk" onclick="mtSetType('Walk')">Walk</button>
        <button type="button" class="mt-toggle-btn" data-type="Run" onclick="mtSetType('Run')">Run</button>
      </div>
    </div>

    <div class="mt-field-row">
      <div class="mt-field">
        <label>Miles</label>
        <input type="text" inputmode="decimal" id="mt-miles-input" placeholder="0.0" oninput="mtMilesChanged()" />
      </div>
      <div class="mt-field">
        <label>Start Time</label>
        <input type="time" id="mt-time-input" oninput="mtTimeEdited()" />
      </div>
    </div>

    <div class="mt-field">
      <label>Shoe</label>
      <select id="mt-shoe-select"><option value="">Loading…</option></select>
    </div>

    <div class="mt-field">
      <label class="mt-checkbox">
        <input type="checkbox" id="mt-notes-toggle" onchange="mtToggleNotes()" />
        <span>Add notes</span>
      </label>
      <div class="mt-notes-wrap" id="mt-notes-wrap">
        <input type="text" id="mt-notes-input" placeholder="" />
      </div>
    </div>

    <div id="mt-last-tracked"></div>
    <button id="mt-submit-btn" onclick="mtSubmit()">Track It!</button>
    <div class="mt-submit-progress"><div class="mt-submit-fill"></div></div>
    <div id="mt-result"></div>
    <div id="mt-error"></div>
  </div>
</div>

<footer class="mt-footer">
  <div class="mt-build">BUILD 001</div>
</footer>

<script>

  /* ===================== Formatting + numeric helpers ===================== */

  function mtFormatDateLabel(yyyymmdd) {
    var d = new Date(yyyymmdd + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function mtFmtMiles(n) { return (typeof n === 'number') ? n.toFixed(1) : '—'; }

  function mtTodayStr() {
    var now = new Date();
    return now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0') + '-' +
      String(now.getDate()).padStart(2, '0');
  }

  function mtPad2(n) { return String(n).padStart(2, '0'); }

  function mtNowHHMM() {
    var n = new Date();
    return mtPad2(n.getHours()) + ':' + mtPad2(n.getMinutes());
  }

  /* ===================== Dashboard ===================== */

  var MT_STAGGER = 200;
  var MT_CASCADE_DELAY = 400;

  function mtCountUp(el, target, formatter, duration, delay) {
    if (delay) {
      setTimeout(function() { mtCountUp(el, target, formatter, duration, 0); }, delay);
      return;
    }
    var start = null;
    function frame(now) {
      if (start === null) start = now;
      var t = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = formatter(target * eased);
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function mtSetNum(id, target, formatter, animate, delay) {
    var el = document.getElementById(id);
    if (typeof target !== 'number' || isNaN(target)) { el.textContent = '—'; return; }
    if (animate) mtCountUp(el, target, formatter, 1000, delay || 0);
    else el.textContent = formatter(target);
  }

  function mtWeekNum(yyyymmdd) {
    var d = new Date(yyyymmdd + 'T12:00:00');
    var year = d.getFullYear();
    var jan1 = new Date(year, 0, 1);
    var firstSun = new Date(year, 0, 1 - jan1.getDay());
    var diffDays = Math.round((d - firstSun) / (24 * 60 * 60 * 1000));
    return Math.floor(diffDays / 7) + 1;
  }

  function mtRefreshStats(animate) {
    MilesTracker.fetchDashboard(function(data) {
      mtRenderStats(data.stats || {}, animate);
      mtRenderLastTracked((data.lastTracked && data.lastTracked.lastDate) || null);
      mtRenderChart((data.weekly12 && data.weekly12.weeks) || [], animate);
      mtHideLoader();
    });
  }

  function mtRenderStats(data, animate) {
    var daysNum = data.days;
    if (typeof daysNum === 'string') daysNum = parseInt(daysNum.split(' ')[0], 10);

    var pctNum = NaN;
    if (typeof data.percent === 'number') {
      pctNum = data.percent <= 1 ? data.percent * 100 : data.percent;
    }

    var fmtInt = function(n) { return Math.round(n).toString(); };
    var fmtPct = function(n) { return Math.round(n) + '%'; };

    var d = animate ? MT_CASCADE_DELAY : 0;
    var s = animate ? MT_STAGGER : 0;
    mtSetNum('mt-miles-val',          data.miles,         mtFmtMiles, animate, d + 0 * s);
    mtSetNum('mt-days-val',           daysNum,            fmtInt,     animate, d + 1 * s);
    if (!isNaN(pctNum)) {
      mtSetNum('mt-percent-val',      pctNum,             fmtPct,     animate, d + 2 * s);
    } else {
      document.getElementById('mt-percent-val').textContent = data.percent != null ? data.percent : '—';
    }
    mtSetNum('mt-week-val',           data.weekMiles,     mtFmtMiles, animate, d + 3 * s);
    mtSetNum('mt-month-val',          data.monthMiles,    mtFmtMiles, animate, d + 4 * s);
    mtSetNum('mt-longest-walk-val',   data.longestWalk,   mtFmtMiles, animate, d + 5 * s);
    mtSetNum('mt-streak-val',         data.streak,        fmtInt,     animate, d + 6 * s);
    mtSetNum('mt-longest-streak-val', data.longestStreak, fmtInt,     animate, d + 7 * s);
  }

  function mtRenderLastTracked(lastDate) {
    var el = document.getElementById('mt-last-tracked');
    if (!lastDate) { el.textContent = 'No miles tracked yet for 2026.'; return; }
    var d = new Date(lastDate + 'T12:00:00');
    var formatted = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    el.textContent = 'Last tracked: ' + formatted;
  }

  function mtRenderChart(weeks, animate) {
    weeks = weeks.slice(-6);
    var max = 0;
    weeks.forEach(function(w) { if (w.miles > max) max = w.miles; });
    if (max === 0) max = 1;
    var barsHtml = '';
    var labelsHtml = '';
    weeks.forEach(function(w, i) {
      var pct = (w.miles / max) * 100;
      var title = w.weekStart + ': ' + w.miles.toFixed(1) + ' mi';
      var lbl = mtWeekNum(w.weekStart);
      var val = w.miles > 0 ? '<div class="mt-bar-value">' + w.miles.toFixed(1) + '</div>' : '';
      var startHeight = animate ? 0 : pct;
      var isCurrent = (i === weeks.length - 1);
      var cls = isCurrent ? 'mt-bar mt-bar-current' : 'mt-bar';
      barsHtml   += '<div class="' + cls + '" data-target-height="' + pct + '" style="height:' + startHeight + '%" title="' + title + '">' + val + '</div>';
      labelsHtml += '<div class="mt-bar-label">' + lbl + '</div>';
    });
    document.getElementById('mt-chart').innerHTML = barsHtml;
    document.getElementById('mt-chart-labels').innerHTML = labelsHtml;
    if (animate) {
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          document.querySelectorAll('#mt-chart .mt-bar').forEach(function(bar, i) {
            setTimeout(function() {
              bar.style.height = bar.getAttribute('data-target-height') + '%';
            }, MT_CASCADE_DELAY + i * MT_STAGGER);
          });
        });
      });
    }
  }

  /* ===================== Loader + submit progress ===================== */

  var mtProgressTimer = null;
  var mtProgressValue = 0;

  function mtStartProgress() {
    var fill = document.querySelector('.mt-loader-fill');
    if (!fill) return;
    mtProgressValue = 0;
    fill.style.width = '0%';
    mtProgressTimer = setInterval(function() {
      if (mtProgressValue >= 95) return;
      var step = Math.max(0.4, (95 - mtProgressValue) * 0.04);
      mtProgressValue += step;
      fill.style.width = mtProgressValue + '%';
    }, 100);
  }

  function mtHideLoader() {
    if (mtProgressTimer) { clearInterval(mtProgressTimer); mtProgressTimer = null; }
    var fill = document.querySelector('.mt-loader-fill');
    if (fill) fill.style.width = '100%';
    setTimeout(function() {
      var loader = document.getElementById('mt-loader');
      if (loader) loader.classList.add('mt-loader-hide');
    }, 350);
  }

  var mtSubmitTimer = null;
  var mtSubmitValue = 0;

  function mtStartSubmitProgress() {
    var btn = document.getElementById('mt-submit-btn');
    var prog = document.querySelector('.mt-submit-progress');
    var fill = prog.querySelector('.mt-submit-fill');
    btn.classList.add('mt-busy');
    mtSubmitValue = 0;
    fill.style.width = '0%';
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { prog.classList.add('mt-show'); });
    });
    mtSubmitTimer = setInterval(function() {
      if (mtSubmitValue >= 95) return;
      var step = Math.max(0.4, (95 - mtSubmitValue) * 0.04);
      mtSubmitValue += step;
      fill.style.width = mtSubmitValue + '%';
    }, 100);
  }

  function mtFinishSubmitProgress() {
    if (mtSubmitTimer) { clearInterval(mtSubmitTimer); mtSubmitTimer = null; }
    var btn = document.getElementById('mt-submit-btn');
    var prog = document.querySelector('.mt-submit-progress');
    var fill = prog.querySelector('.mt-submit-fill');
    fill.style.width = '100%';
    setTimeout(function() {
      prog.classList.remove('mt-show');
      btn.classList.remove('mt-busy');
    }, 350);
  }

  /* ===================== Form state + helpers ===================== */

  var mtType = 'Walk';
  var mtTimeManuallyEdited = false;
  // Pace for back-computing start time when miles is entered. mph.
  var MT_PACE_MPH = 3.4;

  function mtSetType(t) {
    mtType = t;
    document.querySelectorAll('.mt-toggle-btn').forEach(function(b) {
      if (b.getAttribute('data-type') === t) b.classList.add('mt-active');
      else b.classList.remove('mt-active');
    });
  }

  function mtTimeEdited() { mtTimeManuallyEdited = true; }

  function mtMilesChanged() {
    if (mtTimeManuallyEdited) return;
    var miles = parseFloat(document.getElementById('mt-miles-input').value);
    if (!miles || miles <= 0) return;
    var durationMin = Math.round(miles / MT_PACE_MPH * 60);
    var now = new Date();
    now.setMinutes(now.getMinutes() - durationMin);
    document.getElementById('mt-time-input').value =
      mtPad2(now.getHours()) + ':' + mtPad2(now.getMinutes());
  }

  function mtDateChanged() {
    var input = document.getElementById('mt-date-input');
    document.getElementById('mt-date-display').textContent = mtFormatDateLabel(input.value);
  }

  function mtToggleNotes() {
    var checkbox = document.getElementById('mt-notes-toggle');
    var wrap = document.getElementById('mt-notes-wrap');
    if (checkbox.checked) {
      wrap.classList.add('mt-expanded');
      setTimeout(function() {
        document.getElementById('mt-notes-input').focus();
      }, 150);
    } else {
      wrap.classList.remove('mt-expanded');
      document.getElementById('mt-notes-input').value = '';
    }
  }

  function mtInitDate() {
    var today = mtTodayStr();
    var input = document.getElementById('mt-date-input');
    input.value = today;
    input.max = today;
    input.min = '2026-01-01';
    input.addEventListener('change', mtDateChanged);
    mtDateChanged();
  }

  function mtInitTime() {
    document.getElementById('mt-time-input').value = mtNowHHMM();
  }

  function mtLoadShoes() {
    MilesTracker.fetchShoes(function(shoes) {
      var sel = document.getElementById('mt-shoe-select');
      var active = (shoes || []).filter(function(s) { return !s.retired; });
      if (active.length === 0) {
        sel.innerHTML = '<option value="">— add a pair in the Shoes tab —</option>';
        return;
      }
      var html = '<option value="">— none —</option>';
      active.forEach(function(s) {
        var label = (s.name || ((s.brand || '') + ' ' + (s.model || '')).trim());
        html += '<option value="' + label.replace(/"/g, '&quot;') + '">' + label + '</option>';
      });
      sel.innerHTML = html;
      // Default to the first non-retired pair.
      if (sel.options.length > 1) sel.selectedIndex = 1;
    });
  }

  /* ===================== Geolocation + weather ===================== */

  function mtGetLocation() {
    return new Promise(function(resolve) {
      if (!navigator.geolocation) { resolve(null); return; }
      var settled = false;
      function done(val) { if (!settled) { settled = true; resolve(val); } }
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          done({
            lat: Math.round(pos.coords.latitude  * 1e6) / 1e6,
            lon: Math.round(pos.coords.longitude * 1e6) / 1e6
          });
        },
        function() { done(null); },
        { timeout: 8000, maximumAge: 300000, enableHighAccuracy: false }
      );
      setTimeout(function() { done(null); }, 9000);
    });
  }

  function mtWeatherFromCode(code) {
    if (code === 0) return 'Clear';
    if (code <= 3) return 'Cloudy';
    if (code === 45 || code === 48) return 'Fog';
    if (code >= 51 && code <= 57) return 'Drizzle';
    if (code >= 61 && code <= 67) return 'Rain';
    if (code >= 71 && code <= 77) return 'Snow';
    if (code >= 80 && code <= 82) return 'Showers';
    if (code >= 85 && code <= 86) return 'Snow showers';
    if (code >= 95) return 'Thunder';
    return '';
  }

  function mtGetWeather(coords, dateStr, timeStr) {
    if (!coords) return Promise.resolve(null);
    var hh = (timeStr || '12:00').split(':')[0];
    var targetIso = dateStr + 'T' + mtPad2(parseInt(hh, 10)) + ':00';
    var url = 'https://api.open-meteo.com/v1/forecast' +
      '?latitude='  + coords.lat +
      '&longitude=' + coords.lon +
      '&hourly=temperature_2m,weather_code' +
      '&temperature_unit=fahrenheit' +
      '&timezone=auto' +
      '&past_days=7' +
      '&forecast_days=1';
    return fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data || !data.hourly || !data.hourly.time) return null;
        var idx = data.hourly.time.indexOf(targetIso);
        if (idx === -1) return null;
        return {
          temp_f:  Math.round(data.hourly.temperature_2m[idx]),
          weather: mtWeatherFromCode(data.hourly.weather_code[idx])
        };
      })
      .catch(function() { return null; });
  }

  /* ===================== Lifecycle: ready / success / error ===================== */

  MilesTracker.onReady = function() {
    mtSetType('Walk');
    mtInitDate();
    mtInitTime();
    mtLoadShoes();
    mtStartProgress();
    mtRefreshStats(true);
  };

  MilesTracker.onSuccess = function(result) {
    mtFinishSubmitProgress();
    var written = result.written || 0;
    var resultEl = document.getElementById('mt-result');
    resultEl.classList.remove('mt-fade-out');
    resultEl.textContent = '✓ ' + (written === 1 ? 'Walk saved' : (written + ' walks saved'));
    document.getElementById('mt-error').textContent = '';
    mtResetForm();
    mtRefreshStats(false);
    setTimeout(function() {
      resultEl.classList.add('mt-fade-out');
      setTimeout(function() {
        resultEl.textContent = '';
        resultEl.classList.remove('mt-fade-out');
      }, 400);
    }, 2500);
  };

  MilesTracker.onError = function(err) {
    mtFinishSubmitProgress();
    var msg = (typeof err === 'object' && err.result) ? err.result.error.message : String(err);
    document.getElementById('mt-error').textContent = '✗ ' + msg;
    document.getElementById('mt-result').textContent = '';
  };

  function mtResetForm() {
    document.getElementById('mt-miles-input').value = '';
    document.getElementById('mt-notes-input').value = '';
    document.getElementById('mt-notes-toggle').checked = false;
    document.getElementById('mt-notes-wrap').classList.remove('mt-expanded');
    mtTimeManuallyEdited = false;
    mtInitTime();
    // leave date, type, and shoe as-is — most likely same next time
  }

  /* ===================== Submit ===================== */

  function mtSubmit() {
    var date  = document.getElementById('mt-date-input').value;
    var miles = parseFloat(document.getElementById('mt-miles-input').value);
    var startTime = document.getElementById('mt-time-input').value;
    var shoe  = document.getElementById('mt-shoe-select').value;
    var notes = document.getElementById('mt-notes-input').value;

    var errEl = document.getElementById('mt-error');
    function flashError(msg) {
      errEl.classList.remove('mt-fade-out');
      errEl.textContent = msg;
      setTimeout(function() {
        errEl.classList.add('mt-fade-out');
        setTimeout(function() {
          errEl.textContent = '';
          errEl.classList.remove('mt-fade-out');
        }, 400);
      }, 2500);
    }

    if (!date) { flashError('Pick a date.'); return; }
    if (isNaN(miles) || miles <= 0) { flashError('Enter miles greater than 0.'); return; }
    if (date > mtTodayStr()) { flashError("Can't track dates in the future."); return; }

    document.getElementById('mt-result').textContent = '';
    errEl.textContent = '';
    mtStartSubmitProgress();

    mtGetLocation().then(function(coords) {
      return mtGetWeather(coords, date, startTime).then(function(weather) {
        var entry = {
          date:       date,
          miles:      miles,
          type:       mtType,
          start_time: startTime || '',
          shoe:       shoe || '',
          notes:      notes || ''
        };
        if (coords) {
          entry.lat = coords.lat;
          entry.lon = coords.lon;
        }
        if (weather) {
          entry.temp_f  = weather.temp_f;
          entry.weather = weather.weather;
        }
        MilesTracker.logBatch([entry]);
      });
    });
  }

  MilesTracker.init();

</script>

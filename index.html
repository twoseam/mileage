<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 Mileage</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mileage">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#252525">

  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://p.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/ymz2nvi.css">

  <script src="miles-tracker.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scrollbar-width: none; -ms-overflow-style: none; }
    body::-webkit-scrollbar { display: none; }
    body {
      background:
        linear-gradient(
          159deg,
          transparent 0%, transparent 76.6%,
          #016074 76.6%, #016074 78.8%,
          #94D3BE 78.8%, #94D3BE 81.1%,
          #E7D7A4 81.1%, #E7D7A4 83.9%,
          #EB9A00 83.9%, #EB9A00 86.6%,
          #CA6902 86.6%, #CA6902 89.3%,
          #B02113 89.3%, #B02113 100%
        ),
        #252525;
      background-attachment: fixed;
      background-size: cover;
      color: #f5f5f5;
      font-family: "omnes", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wordmark {
      max-width: 500px;
      margin: 3rem auto 3rem;
      padding: 0 2.5rem;
      text-align: center;
      font-family: "omnes", system-ui, sans-serif;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 0.01em;
    }
    .wordmark-year {
      font-size: clamp(3.5rem, 15vw, 6rem);
      color: #8FCFC2;
      margin-bottom: 0.1em;
    }
    .wordmark-title {
      font-size: clamp(3.5rem, 15vw, 6rem);
      color: #E89A1F;
    }

    #miles-tracker {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 2.5rem 2.5rem;
      border-radius: 8px;
    }

    #mt-stats, #mt-stats-2, #mt-stats-3 {
      display: flex;
      gap: 32px;
    }
    #mt-stats   { margin-bottom: 1.75rem; }
    #mt-stats-2 { margin-bottom: 1.75rem; }
    #mt-stats-3 { margin-bottom: 3.25rem; }

    .mt-stat { flex: 1; }

    .mt-stat-label {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.5;
      line-height: 1;
      margin-bottom: 4px;
    }

    .mt-stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    #mt-chart-section { margin-bottom: 3.25rem; }

    .mt-chart-label {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 8px;
    }

    #mt-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 80px;
      padding-top: 14px;
    }

    #mt-chart-labels {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .mt-bar {
      flex: 1;
      min-height: 1px;
      position: relative;
      transition: height 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .mt-bar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #8FCFC2;
      border-radius: 6px 6px 0 0;
    }

    .mt-bar-current::before {
      background: #E89A1F;
    }

    .mt-bar-value {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.6rem;
      color: #fff;
      margin-bottom: 2px;
      line-height: 1;
    }

    .mt-bar-label {
      flex: 1;
      text-align: center;
      font-size: 0.55rem;
      opacity: 0.5;
      line-height: 1;
    }

    .mt-entry {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 1.5rem;
    }

    .mt-entry-field {
      flex: 1;
      position: relative;
    }

    .mt-entry-field label {
      display: block;
      font-size: 0.95rem;
      text-align: left;
      margin-bottom: 6px;
      color: inherit;
    }

    .mt-entry-field label span {
      font-size: 0.85rem;
      opacity: 0.5;
      margin-left: 6px;
    }

    .mt-entry-field input,
    .mt-date-display {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid currentColor;
      border-radius: 0;
      padding: 8px 0;
      font-size: 1rem;
      font-family: inherit;
      color: inherit;
      outline: none;
      -webkit-appearance: none;
      text-align: left;
    }

    .mt-date-display {
      line-height: 1.2;
      pointer-events: none;
    }

    /* Real date input overlays the visible display — taps hit it directly,
       so the native picker opens with no JS shim. */
    .mt-date-real {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2.5rem;
      opacity: 0;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      border: none;
      padding: 0;
      background: transparent;
    }

    .mt-remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      color: inherit;
      opacity: 0.3;
      padding: 0 0 8px 0;
      line-height: 1;
      flex-shrink: 0;
    }
    .mt-remove-btn:hover { opacity: 0.7; }

    #mt-add-row { margin-bottom: 1rem; }

    #mt-add-row button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      color: inherit;
      opacity: 0.5;
      padding: 0;
    }
    #mt-add-row button:hover { opacity: 1; }

    #mt-submit-btn {
      display: block;
      margin: 0 auto 6px;
      border: none;
      border-radius: 10px;
      padding: 16px 52px;
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      color: #1a1a1a;
      background: #E89A1F;
      box-shadow:
        0 5px 0 #8E5A0E,
        0 10px 18px rgba(0, 0, 0, 0.4);
      transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.2s ease;
    }
    #mt-submit-btn:hover { opacity: 0.95; }
    #mt-submit-btn:active {
      transform: translateY(5px);
      box-shadow:
        0 0 0 #8E5A0E,
        0 2px 6px rgba(0, 0, 0, 0.3);
    }
    #mt-submit-btn.mt-busy {
      opacity: 0.4;
      pointer-events: none;
      transform: translateY(5px);
      box-shadow:
        0 0 0 #8E5A0E,
        0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .mt-submit-progress {
      display: none;
      width: 240px;
      height: 8px;
      border-radius: 4px;
      margin: 0.85rem auto 0;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .mt-submit-progress.mt-show { display: block; }
    .mt-submit-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(
        to right,
        #016074 0%,    #016074 16.67%,
        #94D3BE 16.67%, #94D3BE 33.33%,
        #E7D7A4 33.33%, #E7D7A4 50%,
        #EB9A00 50%,    #EB9A00 66.67%,
        #CA6902 66.67%, #CA6902 83.33%,
        #B02113 83.33%, #B02113 100%
      );
      background-size: 240px 100%;
      transition: width 0.3s ease-out;
    }

    #mt-result,
    #mt-error {
      display: none;
      margin: 1.25rem auto 0;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.02em;
      max-width: 280px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.35);
      background: #f5f0e6;
    }
    #mt-result:not(:empty),
    #mt-error:not(:empty) { display: block; }
    #mt-result { color: #016074; transition: opacity 0.4s ease; }
    #mt-error  { color: #B02113; transition: opacity 0.4s ease; }
    #mt-result.mt-fade-out,
    #mt-error.mt-fade-out { opacity: 0; }

    #mt-last-tracked {
      margin-bottom: 1rem;
      font-size: 0.85rem;
      text-align: center;
      opacity: 0.6;
      line-height: 1.5;
    }

    #mt-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    #mt-modal.mt-modal-show { display: flex; }

    .mt-modal-card {
      background: #f5f0e6;
      color: #1a1a1a;
      padding: 2rem 1.75rem 1.5rem;
      border-radius: 16px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    }
    .mt-modal-text {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .mt-modal-text strong { font-weight: 800; }
    .mt-modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mt-modal-buttons button {
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #1a1a1a;
      transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.2s ease;
    }
    .mt-modal-buttons button[data-action="replace"] {
      background: #B02113;
      color: #f5f0e6;
      box-shadow: 0 4px 0 #6C1308, 0 8px 14px rgba(0, 0, 0, 0.25);
      margin-bottom: 4px;
    }
    .mt-modal-buttons button[data-action="replace"]:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #6C1308, 0 2px 4px rgba(0, 0, 0, 0.2);
    }
    .mt-modal-buttons button[data-action="add"] {
      background: #EB9A00;
      color: #1a1a1a;
      box-shadow: 0 4px 0 #8E5A0E, 0 8px 14px rgba(0, 0, 0, 0.25);
      margin-bottom: 4px;
    }
    .mt-modal-buttons button[data-action="add"]:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #8E5A0E, 0 2px 4px rgba(0, 0, 0, 0.2);
    }
    .mt-modal-buttons button[data-action="cancel"] {
      background: transparent;
      color: #1a1a1a;
      opacity: 0.4;
      letter-spacing: 0.08em;
      padding-top: 8px;
      padding-bottom: 4px;
    }
    .mt-modal-buttons button[data-action="cancel"]:hover { opacity: 0.7; }

    #mt-loader {
      position: fixed;
      inset: 0;
      background: #252525;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s ease;
    }
    #mt-loader.mt-loader-hide {
      opacity: 0;
      pointer-events: none;
    }
    .mt-loader-bar {
      width: 280px;
      height: 24px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .mt-loader-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(
        to right,
        #016074 0%,    #016074 16.67%,
        #94D3BE 16.67%, #94D3BE 33.33%,
        #E7D7A4 33.33%, #E7D7A4 50%,
        #EB9A00 50%,    #EB9A00 66.67%,
        #CA6902 66.67%, #CA6902 83.33%,
        #B02113 83.33%, #B02113 100%
      );
      background-size: 280px 100%;
      transition: width 0.3s ease-out;
    }

    .mt-footer {
      text-align: center;
      padding: 0 1.5rem 2rem;
    }
    .mt-footer a {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: inherit;
      text-decoration: none;
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }
    .mt-footer a:hover { opacity: 0.85; }
  </style>
</head>
<body>

<div id="mt-loader">
  <div class="mt-loader-bar">
    <div class="mt-loader-fill"></div>
  </div>
</div>

<header class="wordmark">
  <div class="wordmark-year">2026</div>
  <div class="wordmark-title">MILEAGE</div>
</header>

<div id="miles-tracker">
  <div id="mt-stats">
    <div class="mt-stat">
      <div class="mt-stat-label">Total Miles</div>
      <div class="mt-stat-value" id="mt-miles-val">—</div>
    </div>
    <div class="mt-stat">
      <div class="mt-stat-label">Days walked</div>
      <div class="mt-stat-value" id="mt-days-val">—</div>
    </div>
    <div class="mt-stat">
      <div class="mt-stat-label">Percent</div>
      <div class="mt-stat-value" id="mt-percent-val">—</div>
    </div>
  </div>

  <div id="mt-stats-2">
    <div class="mt-stat">
      <div class="mt-stat-label">Weekly</div>
      <div class="mt-stat-value" id="mt-week-val">—</div>
    </div>
    <div class="mt-stat">
      <div class="mt-stat-label">Monthly</div>
      <div class="mt-stat-value" id="mt-month-val">—</div>
    </div>
    <div class="mt-stat">
      <div class="mt-stat-label">Longest Walk</div>
      <div class="mt-stat-value" id="mt-longest-walk-val">—</div>
    </div>
  </div>

  <div id="mt-stats-3">
    <div class="mt-stat">
      <div class="mt-stat-label">Current Streak</div>
      <div class="mt-stat-value" id="mt-streak-val">—</div>
    </div>
    <div class="mt-stat">
      <div class="mt-stat-label">Longest Streak</div>
      <div class="mt-stat-value" id="mt-longest-streak-val">—</div>
    </div>
    <div class="mt-stat"></div>
  </div>

  <div id="mt-chart-section">
    <div id="mt-chart"></div>
    <div id="mt-chart-labels"></div>
  </div>

  <div id="mt-form">
    <div id="mt-entries"></div>
    <div id="mt-add-row">
      <button onclick="mtAddRow()">+ Add another day</button>
    </div>
    <div id="mt-last-tracked"></div>
    <button id="mt-submit-btn" onclick="mtSubmit()">Track It!</button>
    <div class="mt-submit-progress"><div class="mt-submit-fill"></div></div>
    <div id="mt-result"></div>
    <div id="mt-error"></div>
  </div>
</div>

<footer class="mt-footer">
  <a href="https://docs.google.com/spreadsheets/d/1esqpdcqIxpW55ZIuhkcjzWOBfK99qVzWk5T1YbTkR_4/edit?usp=sharing&rm=minimal" target="_blank" rel="noopener noreferrer">View Source Sheet</a>
</footer>

<div id="mt-modal">
  <div class="mt-modal-card">
    <div class="mt-modal-text"></div>
    <div class="mt-modal-buttons">
      <button data-action="replace">Replace</button>
      <button data-action="add">Add to it</button>
      <button data-action="cancel">Cancel</button>
    </div>
  </div>
</div>

<script>

  function mtFormatDateLabel(yyyymmdd) {
    var d = new Date(yyyymmdd + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function mtFmtMiles(n) {
    return (typeof n === 'number') ? n.toFixed(1) : '—';
  }

  var MT_STAGGER = 200;
  var MT_CASCADE_DELAY = 400;

  function mtCountUp(el, target, formatter, duration, delay) {
    if (delay) {
      setTimeout(function() { mtCountUp(el, target, formatter, duration, 0); }, delay);
      return;
    }
    var start = null;
    function frame(now) {
      if (start === null) start = now;
      var t = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = formatter(target * eased);
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function mtSetNum(id, target, formatter, animate, delay) {
    var el = document.getElementById(id);
    if (typeof target !== 'number' || isNaN(target)) { el.textContent = '—'; return; }
    if (animate) mtCountUp(el, target, formatter, 1000, delay || 0);
    else el.textContent = formatter(target);
  }

  function mtWeekNum(yyyymmdd) {
    var d = new Date(yyyymmdd + 'T12:00:00');
    var year = d.getFullYear();
    var jan1 = new Date(year, 0, 1);
    var firstSun = new Date(year, 0, 1 - jan1.getDay());
    var diffDays = Math.round((d - firstSun) / (24 * 60 * 60 * 1000));
    return Math.floor(diffDays / 7) + 1;
  }

  function mtRefreshStats(animate) {
    MilesTracker.fetchDashboard(function(data) {
      mtRenderStats(data.stats || {}, animate);
      mtRenderLastTracked((data.lastTracked && data.lastTracked.lastDate) || null);
      mtRenderChart((data.weekly12 && data.weekly12.weeks) || [], animate);
      mtHideLoader();
    });
  }

  function mtRenderStats(data, animate) {
    var daysNum = data.days;
    if (typeof daysNum === 'string') daysNum = parseInt(daysNum.split(' ')[0], 10);

    var pctNum = NaN;
    if (typeof data.percent === 'number') {
      pctNum = data.percent <= 1 ? data.percent * 100 : data.percent;
    }

    var fmtInt = function(n) { return Math.round(n).toString(); };
    var fmtPct = function(n) { return Math.round(n) + '%'; };

    var d = animate ? MT_CASCADE_DELAY : 0;
    var s = animate ? MT_STAGGER : 0;
    mtSetNum('mt-miles-val',          data.miles,         mtFmtMiles, animate, d + 0 * s);
    mtSetNum('mt-days-val',           daysNum,            fmtInt,     animate, d + 1 * s);
    if (!isNaN(pctNum)) {
      mtSetNum('mt-percent-val',      pctNum,             fmtPct,     animate, d + 2 * s);
    } else {
      document.getElementById('mt-percent-val').textContent = data.percent != null ? data.percent : '—';
    }
    mtSetNum('mt-week-val',           data.weekMiles,     mtFmtMiles, animate, d + 3 * s);
    mtSetNum('mt-month-val',          data.monthMiles,    mtFmtMiles, animate, d + 4 * s);
    mtSetNum('mt-longest-walk-val',   data.longestWalk,   mtFmtMiles, animate, d + 5 * s);
    mtSetNum('mt-streak-val',         data.streak,        fmtInt,     animate, d + 6 * s);
    mtSetNum('mt-longest-streak-val', data.longestStreak, fmtInt,     animate, d + 7 * s);
  }

  function mtRenderLastTracked(lastDate) {
    var el = document.getElementById('mt-last-tracked');
    if (!lastDate) { el.textContent = 'No miles tracked yet for 2026.'; return; }
    var d = new Date(lastDate + 'T12:00:00');
    var formatted = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    el.textContent = 'Last tracked: ' + formatted;
  }

  function mtRenderChart(weeks, animate) {
    weeks = weeks.slice(-6);
    var max = 0;
    weeks.forEach(function(w) { if (w.miles > max) max = w.miles; });
    if (max === 0) max = 1;
    var barsHtml = '';
    var labelsHtml = '';
    weeks.forEach(function(w, i) {
      var pct = (w.miles / max) * 100;
      var title = w.weekStart + ': ' + w.miles.toFixed(1) + ' mi';
      var lbl = mtWeekNum(w.weekStart);
      var val = w.miles > 0 ? '<div class="mt-bar-value">' + w.miles.toFixed(1) + '</div>' : '';
      var startHeight = animate ? 0 : pct;
      var isCurrent = (i === weeks.length - 1);
      var cls = isCurrent ? 'mt-bar mt-bar-current' : 'mt-bar';
      barsHtml   += '<div class="' + cls + '" data-target-height="' + pct + '" style="height:' + startHeight + '%" title="' + title + '">' + val + '</div>';
      labelsHtml += '<div class="mt-bar-label">' + lbl + '</div>';
    });
    document.getElementById('mt-chart').innerHTML = barsHtml;
    document.getElementById('mt-chart-labels').innerHTML = labelsHtml;
    if (animate) {
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          document.querySelectorAll('#mt-chart .mt-bar').forEach(function(bar, i) {
            setTimeout(function() {
              bar.style.height = bar.getAttribute('data-target-height') + '%';
            }, MT_CASCADE_DELAY + i * MT_STAGGER);
          });
        });
      });
    }
  }

  var mtProgressTimer = null;
  var mtProgressValue = 0;

  function mtStartProgress() {
    var fill = document.querySelector('.mt-loader-fill');
    if (!fill) return;
    mtProgressValue = 0;
    fill.style.width = '0%';
    mtProgressTimer = setInterval(function() {
      if (mtProgressValue >= 95) return;
      var step = Math.max(0.4, (95 - mtProgressValue) * 0.04);
      mtProgressValue += step;
      fill.style.width = mtProgressValue + '%';
    }, 100);
  }

  function mtHideLoader() {
    if (mtProgressTimer) { clearInterval(mtProgressTimer); mtProgressTimer = null; }
    var fill = document.querySelector('.mt-loader-fill');
    if (fill) fill.style.width = '100%';
    setTimeout(function() {
      var loader = document.getElementById('mt-loader');
      if (loader) loader.classList.add('mt-loader-hide');
    }, 350);
  }

  var mtSubmitTimer = null;
  var mtSubmitValue = 0;

  function mtStartSubmitProgress() {
    var btn = document.getElementById('mt-submit-btn');
    var prog = document.querySelector('.mt-submit-progress');
    var fill = prog.querySelector('.mt-submit-fill');
    btn.classList.add('mt-busy');
    prog.classList.add('mt-show');
    mtSubmitValue = 0;
    fill.style.width = '0%';
    mtSubmitTimer = setInterval(function() {
      if (mtSubmitValue >= 95) return;
      var step = Math.max(0.4, (95 - mtSubmitValue) * 0.04);
      mtSubmitValue += step;
      fill.style.width = mtSubmitValue + '%';
    }, 100);
  }

  function mtFinishSubmitProgress() {
    if (mtSubmitTimer) { clearInterval(mtSubmitTimer); mtSubmitTimer = null; }
    var fill = document.querySelector('.mt-submit-fill');
    if (fill) fill.style.width = '100%';
    setTimeout(function() {
      var btn = document.getElementById('mt-submit-btn');
      var prog = document.querySelector('.mt-submit-progress');
      btn.classList.remove('mt-busy');
      prog.classList.remove('mt-show');
    }, 300);
  }

  MilesTracker.onReady = function() {
    if (document.querySelectorAll('.mt-entry').length === 0) mtAddRow();
    mtStartProgress();
    mtRefreshStats(true);
  };

  MilesTracker.onSuccess = function(result) {
    mtFinishSubmitProgress();
    var resultEl = document.getElementById('mt-result');
    resultEl.classList.remove('mt-fade-out');
    resultEl.textContent = '✓ ' + result.written + ' day' + (result.written !== 1 ? 's' : '') + ' saved!';
    document.getElementById('mt-error').textContent = '';
    document.getElementById('mt-entries').innerHTML = '';
    mtAddRow();
    mtRefreshStats(false);
    setTimeout(function() {
      resultEl.classList.add('mt-fade-out');
      setTimeout(function() {
        resultEl.textContent = '';
        resultEl.classList.remove('mt-fade-out');
      }, 400);
    }, 2500);
  };

  MilesTracker.onError = function(err) {
    mtFinishSubmitProgress();
    var msg = (typeof err === 'object' && err.result) ? err.result.error.message : String(err);
    document.getElementById('mt-error').textContent = '✗ ' + msg;
    document.getElementById('mt-result').textContent = '';
  };

  function mtDateChanged(input) {
    var disp = input.previousElementSibling;
    if (disp) disp.textContent = mtFormatDateLabel(input.value);
  }

  function mtTodayStr() {
    var now = new Date();
    return now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0') + '-' +
      String(now.getDate()).padStart(2, '0');
  }

  function mtAddRow() {
    var container = document.getElementById('mt-entries');
    var row = document.createElement('div');
    row.className = 'mt-entry';
    var existingDates = container.querySelectorAll('.mt-entry input[type="date"]');
    var todayStr = mtTodayStr();
    var defaultDate;
    if (existingDates.length > 0) {
      var nextDate = new Date(existingDates[existingDates.length - 1].value + 'T12:00:00');
      nextDate.setDate(nextDate.getDate() + 1);
      var nextStr = nextDate.toISOString().split('T')[0];
      defaultDate = (nextStr > todayStr) ? todayStr : nextStr;
    } else {
      defaultDate = todayStr;
    }
    row.innerHTML =
      '<div class="mt-entry-field">' +
        '<label>Date</label>' +
        '<div class="mt-date-display">' + mtFormatDateLabel(defaultDate) + '</div>' +
        '<input type="date" class="mt-date-real" value="' + defaultDate + '" max="' + todayStr + '" min="2026-01-01" onchange="mtDateChanged(this)" />' +
      '</div>' +
      '<div class="mt-entry-field">' +
        '<label>Miles <span></span></label>' +
        '<input class="mt-miles-input" type="text" inputmode="decimal" placeholder="0.00" min="0" step="0.01" />' +
      '</div>' +
      '<button class="mt-remove-btn" onclick="this.parentElement.remove()" title="Remove">×</button>';
    container.appendChild(row);
  }

  function mtAskMode(date, existing, attempting) {
    return new Promise(function(resolve) {
      var modal = document.getElementById('mt-modal');
      var formatted = mtFormatDateLabel(date);
      var combined = (existing + attempting).toFixed(1);
      modal.querySelector('.mt-modal-text').innerHTML =
        '<strong>' + formatted + '</strong> already has <strong>' +
        existing.toFixed(1) + '&nbsp;mi</strong> logged.<br><br>' +
        'Replace it with <strong>' + attempting.toFixed(1) + '&nbsp;mi</strong>,<br>' +
        'or add to it (total: <strong>' + combined + '&nbsp;mi</strong>)?';
      var buttons = modal.querySelectorAll('button');
      function cleanup(choice) {
        modal.classList.remove('mt-modal-show');
        buttons.forEach(function(b) { b.onclick = null; });
        resolve(choice);
      }
      buttons.forEach(function(btn) {
        btn.onclick = function() { cleanup(btn.getAttribute('data-action')); };
      });
      modal.classList.add('mt-modal-show');
    });
  }

  function mtSubmit() {
    var rows = document.querySelectorAll('.mt-entry');
    var entries = [];
    rows.forEach(function(row) {
      var date  = row.querySelector('input[type="date"]').value;
      var miles = parseFloat(row.querySelector('.mt-miles-input').value);
      if (date && !isNaN(miles) && miles >= 0) entries.push({ date: date, miles: miles });
    });
    if (entries.length === 0) {
      document.getElementById('mt-error').textContent = 'Please enter at least one date and mileage.';
      return;
    }
    var todayStr = mtTodayStr();
    if (entries.some(function(e) { return e.date > todayStr; })) {
      var errEl = document.getElementById('mt-error');
      errEl.classList.remove('mt-fade-out');
      errEl.textContent = "Can't track dates in the future.";
      setTimeout(function() {
        errEl.classList.add('mt-fade-out');
        setTimeout(function() {
          errEl.textContent = '';
          errEl.classList.remove('mt-fade-out');
        }, 400);
      }, 2500);
      return;
    }

    document.getElementById('mt-result').textContent = '';
    document.getElementById('mt-error').textContent = '';
    mtStartSubmitProgress();

    var dates = entries.map(function(e) { return e.date; });
    MilesTracker.fetchPeek(dates, function(existingMap) {
      var i = 0;
      function next() {
        if (i >= entries.length) {
          MilesTracker.logBatch(entries);
          return;
        }
        var entry = entries[i];
        var prev = existingMap[entry.date];
        if (typeof prev === 'number' && prev > 0) {
          mtAskMode(entry.date, prev, entry.miles).then(function(choice) {
            if (choice === 'cancel') {
              mtFinishSubmitProgress();
              return;
            }
            entry.mode = choice;
            i++;
            next();
          });
        } else {
          i++;
          next();
        }
      }
      next();
    });
  }

  MilesTracker.init();
</script>

</body>
</html>

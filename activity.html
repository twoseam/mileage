  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #252525; color: #f5f5f5; min-height: 100vh;
      font-family: "omnes", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    html[data-theme="light"] body { background: #f1ebdd; color: #171717; }
  </style>
</head>
<body>
<script>
  // Direct link / shared URL / PWA deep link: host the shared panel,
  // open it instantly (no slide — there's no list to slide over here).
  (function () {
    var m = /[?&]id=([^&]*)/.exec(location.search);
    var id = m ? decodeURIComponent(m[1]) : '';
    if (!id) { location.replace('history.html'); return; }
    ActivityPanel.open(id, { animate: false, replace: true });
  })();
</script>
</body>
